    function createSnow() {
      if (snowPoints) {
        scene.remove(snowPoints);
        snowPoints.geometry.dispose();
        snowPoints.material.dispose();
        snowPoints = null;
        snowData = [];
      }
      if (CONFIG.snow.count <= 0) return;
      const pos = new Float32Array(CONFIG.snow.count * 3);
      for (let i = 0; i < CONFIG.snow.count; i++) {
        const x = (Math.random() - 0.5) * CONFIG.snow.range;
        const y = (Math.random() - 0.5) * CONFIG.snow.range + 10;
        const z = (Math.random() - 0.5) * CONFIG.snow.range;
        pos[i * 3] = x; pos[i * 3 + 1] = y; pos[i * 3 + 2] = z;
        snowData.push({ x, y, z, vy: 0.65 + Math.random() * 0.55, drift: Math.random() * Math.PI * 2 });
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      snowPoints = new THREE.Points(geo, new THREE.PointsMaterial({
        color: 0xeaf2ff, map: softBokehTex, size: 0.26,
        transparent: true, opacity: 0.54, depthWrite: false, blending: THREE.AdditiveBlending
      }));
      scene.add(snowPoints);
    }

    function addPhotoFromDataUrl(dataUrl, id) {
      const img = new Image();
      img.onload = () => {
        const tex = new THREE.Texture(img);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.needsUpdate = true;

        const aspect = img.width / img.height;
        let w = 1.5, h = 1.5;
        if (aspect > 1) h = w / aspect; else w = h * aspect;

        const frame = new THREE.Mesh(
          new THREE.BoxGeometry(w + 0.20, h + 0.20, 0.06),
          new THREE.MeshStandardMaterial({ color: 0xd6b87c, metalness: 0.72, roughness: 0.34 })
        );
        const plane = new THREE.Mesh(
          new THREE.PlaneGeometry(w, h),
          new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide })
        );
        plane.position.z = 0.036;

        const group = new THREE.Group();
        group.add(frame);
        group.add(plane);
        group.scale.setScalar(0.8);
        frame.userData.photoGroup = group;
        plane.userData.photoGroup = group;

        const u = 0.14 + Math.random() * 0.68;
        const r = CONFIG.tree.radius * Math.pow(1 - u, 1.12) * 1.04;
        const a = Math.random() * Math.PI * 2;
        const posTree = new THREE.Vector3(Math.cos(a) * r, u * CONFIG.tree.height - CONFIG.tree.height / 2, Math.sin(a) * r);
        const posScatter = computeScatterPos(9.5, 11.5);
        group.position.copy(posTree);

        photoMeshGroup.add(group);
        photoRecords.push({ id, data: dataUrl, group, posTree, posScatter, baseScale: 0.8 });
        refreshAlbumIfOpen();
      };
      img.src = dataUrl;
    }

    function hexToRgb(hex) {
      const v = parseInt(hex.replace('#', ''), 16);
      return { r: (v >> 16) & 255, g: (v >> 8) & 255, b: v & 255 };
    }

    function sampleParticleText(keepRevealed = false) {
      const w = window.innerWidth, h = window.innerHeight;
      const scale = TEXT_ENGINE.sizePct / 100;
      const isMob = w <= 768;

      // PC 端右侧优雅宽裕排版；手机端居中上方排版
      const blockW = isMob ? Math.min(w * 0.90, 380) : Math.min(w * 0.44, 520);
      const startX = isMob ? (w - blockW) * 0.5 : w - blockW - Math.max(28, w * 0.045);
      const toolbarBottom = isMob ? document.getElementById('top-right-controls').getBoundingClientRect().bottom : 0;
      const startY = isMob ? Math.max(toolbarBottom + 10, h * 0.065) : h * 0.16;
      TEXT_ENGINE.boxRect = { x: startX, y: startY, w: blockW };

      const fontSize = Math.round((isMob ? 21 : 29) * scale);
      const lineGap = Math.round(fontSize * 1.78);
      const blessingStartY = startY + (isMob ? 74 : 106) * scale;

      const off = document.createElement('canvas');
      const octx = off.getContext('2d', { willReadFrequently: true });
      const cellW = Math.ceil(fontSize * 1.5);
      const cellH = Math.ceil(fontSize * 1.5);
      off.width = cellW;
      off.height = cellH;

      const baseRgb = hexToRgb(TEXT_ENGINE.colorHex);
      const lines = (TEXT_ENGINE.blessingText || '').split(/\r?\n/);
      const chars = [];
      const stray = [];

      const charAdvance = (ch, px) => {
        if (ch.trim() === '') return px * 0.55;
        return /[\u4e00-\u9fff]/.test(ch) ? px * 1.24 : px * 0.70;
      };

      // 按最长行自动微调字号，保证「愿所有的美好都如约而至」永远舒展排在一行绝不掉字
      let maxRowFactor = 0;
      lines.forEach(rawLine => {
        let f = 0;
        for (const ch of rawLine) f += charAdvance(ch, 1);
        if (f > maxRowFactor) maxRowFactor = f;
      });
      const fitFontSize = maxRowFactor > 0 ? Math.min(fontSize, Math.floor((blockW - 12) / maxRowFactor)) : fontSize;

      lines.forEach((rawLine, rowIdx) => {
        const trimmed = rawLine.trim();
        const isSig = trimmed.startsWith('——') || trimmed.startsWith('--') || /^\d{4}[./-]\d/.test(trimmed);
        const rowFontPx = isSig ? Math.round(fitFontSize * 0.80) : fitFontSize;
        const rowY = blessingStartY + rowIdx * lineGap;
        let totalRowW = 0;
        for (const ch of rawLine) totalRowW += charAdvance(ch, rowFontPx);
        let curX = isSig ? (startX + blockW - totalRowW - 10) : (isMob ? startX + (blockW - totalRowW) * 0.5 : startX);

        for (const ch of rawLine) {
          const adv = charAdvance(ch, rowFontPx);
          if (ch.trim() === '') { curX += adv; continue; }
          octx.clearRect(0, 0, cellW, cellH);
          octx.fillStyle = '#ffffff';
          octx.textAlign = 'center';
          octx.textBaseline = 'middle';
          // 端正秀气楷体/细宋体，笔画清晰可辨
          octx.font = `400 ${rowFontPx}px "LXGW WenKai", "KaiTi", "STKaiti", "Noto Serif SC", serif`;
          octx.fillText(ch, cellW * 0.5, cellH * 0.52);

          const imgData = octx.getImageData(0, 0, cellW, cellH).data;
          const pts = [];
          for (let py = 0; py < cellH; py += 2) {
            for (let px = 0; px < cellW; px += 2) {
              const a = imgData[(py * cellW + px) * 4 + 3];
              if (a > 125 && Math.random() < 0.62) {
                const wx = curX + (px - cellW * 0.5) + adv * 0.5 + (Math.random() - 0.5) * 0.38;
                const wy = rowY + (py - cellH * 0.52) + (Math.random() - 0.5) * 0.38;
                const isHot = Math.random() < 0.20;
                pts.push({
                  x: wx, y: wy,
                  r: isHot ? (0.85 + Math.random() * 0.35) : (0.52 + Math.random() * 0.35),
                  color: isHot
                    ? '#ffffff'
                    : `rgb(${Math.min(255, baseRgb.r + 6)}, ${Math.max(195, baseRgb.g - 6)}, ${Math.min(255, baseRgb.b + 6)})`,
                  phase: Math.random() * Math.PI * 2,
                  alpha: 0.68 + (a / 255) * 0.30
                });
                if (Math.random() < 0.015) {
                  stray.push({
                    x: wx + (Math.random() - 0.5) * 10,
                    y: wy + (Math.random() - 0.5) * 10,
                    r: 0.45 + Math.random() * 0.45,
                    phase: Math.random() * Math.PI * 2
                  });
                }
              }
            }
          }
          const charIdx = chars.length;
          const wasShown = keepRevealed && charIdx < TEXT_ENGINE.writeIndex;
          chars.push({
            ch,
            fontPx: rowFontPx,
            particles: pts,
            cx: curX + adv * 0.5,
            cy: rowY,
            rowIdx,
            revealed: wasShown,
            revealProgress: wasShown ? 1 : 0
          });
          curX += adv;
        }
      });

      TEXT_ENGINE.chars = chars;
      TEXT_ENGINE.strayDust = stray;
    }

    function startParticleTextAnimation() {
      if (!TEXT_ENGINE.enabled) return;
      sampleParticleText();
      TEXT_ENGINE.active = true;
      TEXT_ENGINE.titleProgress = 0;
      TEXT_ENGINE.writeIndex = 0;
      TEXT_ENGINE.sparks = [];
      TEXT_ENGINE.startTime = performance.now();
      TEXT_ENGINE.nextCharAt = performance.now() + 950;
      TEXT_ENGINE.finishedAt = 0;
      if (TEXT_ENGINE.chars.length > 0) {
        TEXT_ENGINE.penX = TEXT_ENGINE.chars[0].cx - 24;
        TEXT_ENGINE.penY = TEXT_ENGINE.chars[0].cy;
        TEXT_ENGINE.targetX = TEXT_ENGINE.chars[0].cx;
        TEXT_ENGINE.targetY = TEXT_ENGINE.chars[0].cy;
      }
    }

    function spawnPenSparks(x, y, n) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 14 + Math.random() * 48;
        TEXT_ENGINE.sparks.push({
          x, y,
          vx: Math.cos(a) * sp,
          vy: Math.sin(a) * sp - 14,
          age: 0,
          life: 0.45 + Math.random() * 0.5,
          r: 0.9 + Math.random() * 1.6,
          col: Math.random() < 0.55 ? '#fff2c2' : '#ffd2e4'
        });
      }
    }

    function renderParticleTextLayer(dt, now) {
      if (STATE.introPlaying || !TEXT_ENGINE.active) return;
      const tc = document.getElementById('text-particle-canvas');
      if (!tc) return;
      const fadeElapsed = TEXT_ENGINE.finishedAt ? now - TEXT_ENGINE.finishedAt - 4000 : 0;
      const fadeDuration = fadeElapsed > 0 && matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 900;
      if (fadeElapsed > 0 && fadeElapsed >= fadeDuration) {
        tc.style.opacity = '0';
        TEXT_ENGINE.active = false;
        return;
      }
      if (fadeElapsed > 0) tc.style.opacity = String(1 - fadeElapsed / fadeDuration);
      else if (tc.style.opacity !== '1') tc.style.opacity = '1';
      const ctx = tc.getContext('2d');
      const dpr = TEXT_ENGINE.dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      const scale = TEXT_ENGINE.sizePct / 100;
      const isMob = window.innerWidth <= 768;
      const { x: bx, y: by, w: bw } = TEXT_ENGINE.boxRect;

      // 1. 主标题 Merry Christmas（清秀花体 + 渐现扫光）+ 副标题细宋体
      TEXT_ENGINE.titleProgress = Math.min(1, TEXT_ENGINE.titleProgress + dt * 0.72);
      const tp = TEXT_ENGINE.titleProgress;

      ctx.save();
      ctx.beginPath();
      ctx.rect(bx - 30, by - 40, (bw + 60) * tp, 140 * scale);
      ctx.clip();

      ctx.font = `400 ${Math.round((isMob ? 36 : 54) * scale)}px "Great Vibes", cursive`;
      ctx.textAlign = isMob ? 'center' : 'left';
      ctx.textBaseline = 'top';
      ctx.fillStyle = '#fff9f5';
      ctx.shadowColor = 'rgba(248, 180, 212, 0.52)';
      ctx.shadowBlur = 16;
      ctx.fillText(TEXT_ENGINE.titleText, isMob ? bx + bw * 0.5 : bx, by, bw);

      ctx.shadowBlur = 8;
      ctx.font = `300 ${Math.round((isMob ? 10.5 : 12) * scale)}px "Noto Serif SC", serif`;
      ctx.fillStyle = `rgba(255, 236, 240, ${(0.72 * Math.max(0, (tp - 0.3) / 0.7)).toFixed(2)})`;
      ctx.fillText(TEXT_ENGINE.subText, isMob ? bx + bw * 0.5 : bx + 4, by + (isMob ? 46 : 64) * scale);
      ctx.restore();

      // 2. 流星笔尖逐字点亮粒子点阵楷体
      const hasMore = TEXT_ENGINE.writeIndex < TEXT_ENGINE.chars.length;
      if (hasMore && now >= TEXT_ENGINE.nextCharAt) {
        const cObj = TEXT_ENGINE.chars[TEXT_ENGINE.writeIndex];
        cObj.revealed = true;
        TEXT_ENGINE.targetX = cObj.cx;
        TEXT_ENGINE.targetY = cObj.cy;
        spawnPenSparks(cObj.cx, cObj.cy, 10);
        TEXT_ENGINE.writeIndex++;
        const nextObj = TEXT_ENGINE.chars[TEXT_ENGINE.writeIndex];
        const pause = (nextObj && nextObj.rowIdx !== cObj.rowIdx) ? 380 : 185;
        TEXT_ENGINE.nextCharAt = now + pause;
      }
      if (!TEXT_ENGINE.finishedAt && tp === 1 && TEXT_ENGINE.writeIndex >= TEXT_ENGINE.chars.length) {
        TEXT_ENGINE.finishedAt = now;
      }

      // 渲染已点亮字符：清透楷体柔和底笔 + 紧贴笔画的极细星尘微光点（清晰优雅、不杂乱）
      const tSec = now * 0.001;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (const cObj of TEXT_ENGINE.chars) {
        if (!cObj.revealed) continue;
        cObj.revealProgress = Math.min(1, cObj.revealProgress + dt * 3.4);
        const rp = cObj.revealProgress;

        // 1. 轻柔清晰的楷体主笔画（确保一眼看清每一个字）
        ctx.save();
        ctx.globalAlpha = 0.74 * rp;
        ctx.font = `400 ${cObj.fontPx}px "LXGW WenKai", "KaiTi", "STKaiti", "Noto Serif SC", serif`;
        ctx.fillStyle = TEXT_ENGINE.colorHex;
        ctx.shadowColor = 'rgba(255, 200, 224, 0.42)';
        ctx.shadowBlur = 10;
        ctx.fillText(cObj.ch, cObj.cx, cObj.cy);
        ctx.restore();

        // 2. 紧贴笔画的极细星尘高光微粒（克制闪烁，不喧宾夺主）
        for (const pt of cObj.particles) {
          const twinkle = 0.55 + 0.45 * Math.sin(tSec * 2.8 + pt.phase);
          ctx.globalAlpha = pt.alpha * rp * twinkle * 0.78;
          ctx.fillStyle = pt.color;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // 游离微尘
      if (TEXT_ENGINE.writeIndex > 0) {
        ctx.fillStyle = '#ffe2ee';
        for (const d of TEXT_ENGINE.strayDust) {
          ctx.globalAlpha = 0.20 + 0.25 * Math.sin(tSec * 2.4 + d.phase);
          ctx.beginPath();
          ctx.arc(d.x, d.y + Math.sin(tSec + d.phase) * 1.5, d.r, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // 流星笔尖
      TEXT_ENGINE.penX += (TEXT_ENGINE.targetX - TEXT_ENGINE.penX) * Math.min(1, dt * 15);
      TEXT_ENGINE.penY += (TEXT_ENGINE.targetY - TEXT_ENGINE.penY) * Math.min(1, dt * 15);
      const showPen = hasMore ? (now >= TEXT_ENGINE.startTime + 650) : (now - TEXT_ENGINE.finishedAt < 650);
      if (showPen && TEXT_ENGINE.chars.length > 0) {
        const pa = hasMore ? 1 : Math.max(0, 1 - (now - TEXT_ENGINE.finishedAt) / 650);
        if (Math.random() < 0.7) spawnPenSparks(TEXT_ENGINE.penX, TEXT_ENGINE.penY, 2);
        ctx.save();
        ctx.translate(TEXT_ENGINE.penX, TEXT_ENGINE.penY);
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = pa;
        const g = ctx.createRadialGradient(0, 0, 1, 0, 0, 16);
        g.addColorStop(0, 'rgba(255,255,255,1)');
        g.addColorStop(0.35, 'rgba(255,232,170,0.8)');
        g.addColorStop(1, 'rgba(255,190,150,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }

      // 飘落金色星尘火花
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (let i = TEXT_ENGINE.sparks.length - 1; i >= 0; i--) {
        const s = TEXT_ENGINE.sparks[i];
        s.age += dt;
        if (s.age >= s.life) { TEXT_ENGINE.sparks.splice(i, 1); continue; }
        s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 45 * dt;
        ctx.globalAlpha = Math.max(0, 1 - s.age / s.life);
        ctx.fillStyle = s.col;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    /* ==================== 电影级开场特效 ==================== */
    const INTRO = { particles: [], duration: 5.8 };

    function startIntroSequence() {
      resizeOverlayCanvases();
      const c = document.getElementById('intro-canvas');
      INTRO.particles = [];
      const w = c.width, h = c.height, cx = w * 0.5, cy = h * 0.5;
      const count = IS_MOBILE ? 600 : 1100;
      const cols = ['#ffffff', '#dceeff', '#ffd8e8', '#ffe8be'];
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 110 + Math.pow(Math.random(), 0.72) * Math.max(w, h) * 0.62;
        INTRO.particles.push({
          x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          r: 0.8 + Math.random() * 1.8, col: cols[i % cols.length], ph: Math.random() * 6
        });
      }
      STATE.mode = 'TREE';
      STATE.morph = 1;
      STATE.introPlaying = true;
      STATE.introTime = 0;
      TEXT_ENGINE.active = false;
      c.style.display = 'block';
      document.getElementById('skip-intro-btn').style.display = 'inline-flex';
    }

    function finishIntroSequence() {
      if (!STATE.introPlaying) return;
      STATE.introPlaying = false;
      const c = document.getElementById('intro-canvas');
      if (c) { c.getContext('2d').clearRect(0, 0, c.width, c.height); c.style.display = 'none'; }
      document.getElementById('skip-intro-btn').style.display = 'none';
      if (STATE.fireworksEnabled) {
        spawnWillowFirework();
        setTimeout(() => STATE.fireworksEnabled && spawnWillowFirework(), 550);
      }
      startParticleTextAnimation();
    }

    function updateIntroOverlay(dt) {
      const c = document.getElementById('intro-canvas');
      if (!c) return;
      const ctx = c.getContext('2d');
      STATE.introTime += dt;
      const t = STATE.introTime;
      const w = c.width, h = c.height, cx = w * 0.5, cy = h * 0.5;
      ctx.clearRect(0, 0, w, h);

      const bgAlpha = t > 2.4 ? Math.max(0, 1 - (t - 2.4) / 2.4) : 1;
      if (bgAlpha > 0) {
        ctx.fillStyle = `rgba(3, 1, 6, ${bgAlpha.toFixed(3)})`;
        ctx.fillRect(0, 0, w, h);
      }

      if (t < 2.3) {
        const p = Math.min(1, t / 1.85);
        const ease = Math.pow(p, 2.2);
        const fade = t > 1.85 ? Math.max(0, 1 - (t - 1.85) / 0.45) : 1;
        const rayLen = 46 + ease * Math.max(w, h) * 0.48;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = fade;
        const g = ctx.createRadialGradient(0, 0, 1, 0, 0, 26 + ease * 110);
        g.addColorStop(0, 'rgba(255,255,255,1)');
        g.addColorStop(0.25, 'rgba(220,236,255,0.75)');
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(0, 0, 26 + ease * 110, 0, Math.PI * 2); ctx.fill();

        ctx.rotate(-0.4 + t * 0.08);
        for (let k = 0; k < 2; k++) {
          ctx.rotate(Math.PI / 2);
          const rg = ctx.createLinearGradient(-rayLen, 0, rayLen, 0);
          rg.addColorStop(0, 'rgba(255,255,255,0)');
          rg.addColorStop(0.5, 'rgba(255,255,255,0.95)');
          rg.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.fillStyle = rg;
          ctx.beginPath(); ctx.ellipse(0, 0, rayLen, 1.3 + ease * 2.6, 0, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
      }

      if (t >= 1.8) {
        const bt = t - 1.8;
        const pa = bt > 2.4 ? Math.max(0, 1 - (bt - 2.4) / 1.5) : Math.min(1, bt / 0.3);
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        const tx = cx, ty = cy + h * 0.14;
        for (const pt of INTRO.particles) {
          if (bt < 1.6) {
            pt.x += pt.vx * dt; pt.y += pt.vy * dt;
            pt.vx *= Math.pow(0.955, dt * 60); pt.vy *= Math.pow(0.955, dt * 60);
          } else {
            const dx = tx - pt.x, dy = ty - pt.y;
            pt.x += (dx * 2.3 - dy * 1.4) * dt;
            pt.y += (dy * 2.3 + dx * 0.7) * dt;
          }
          ctx.globalAlpha = pa * (0.55 + 0.45 * Math.sin(t * 7 + pt.ph));
          ctx.fillStyle = pt.col;
          ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
      }
      if (t >= INTRO.duration) finishIntroSequence();
    }

      document.getElementById('mode-tree-btn').classList.toggle('active', mode === 'TREE');
      document.getElementById('mode-scatter-btn').classList.toggle('active', mode === 'SCATTER');

    }

    function stepFocusPhoto(delta) {
      if (!photoRecords.length) return;
      const cur = photoRecords.findIndex(r => r.group === STATE.focusTarget);
      const next = (cur + delta + photoRecords.length) % photoRecords.length;
      setMode('FOCUS', photoRecords[next].group);
    }

    function triggerPhotoGrab() {
      if (!photoRecords.length) return;
      let best = null, bestD = Infinity;
      const v = new THREE.Vector3();
      for (const r of photoRecords) {
        r.group.updateMatrixWorld();
        r.group.getWorldPosition(v);
        v.project(camera);
        const d = Math.hypot(v.x, v.y);
        if (v.z < 1 && d < bestD) { bestD = d; best = r.group; }
      }
      setMode('FOCUS', best || photoRecords[0].group);
    }

    /* ==================== INS 圣诞精装 3D 翻页手账相册（Paper 风格） ==================== */
    const PAPER_NOTES_KEY = 'StarlightTreeV2_PaperNotes';

    function getAlbumSpreads() {
      // 每 2 张照片组成 1 个高颜值跨页（不足时自动优雅排布）
      const spreads = [];

      const btn = document.getElementById('paper-autoplay-btn');

    }

    function togglePaperCover() {
      ALBUM.isCover = !ALBUM.isCover;
      ALBUM.lastDir = 0;
      renderPaperAlbum();
    }

    function stepPaperSpread(delta, animate = true) {
      const spreads = getAlbumSpreads();
      if (ALBUM.isCover) {
        if (delta > 0) {
          ALBUM.isCover = false;
          ALBUM.spreadIndex = 0;
          ALBUM.lastDir = 1;
          renderPaperAlbum();
        }
        return;
      }
      const next = ALBUM.spreadIndex + delta;
      if (next < 0) {
        ALBUM.isCover = true;
        ALBUM.lastDir = -1;
      } else if (next >= spreads.length) {
        ALBUM.spreadIndex = 0;
        ALBUM.lastDir = 1;
      } else {
        ALBUM.spreadIndex = next;
        ALBUM.lastDir = delta > 0 ? 1 : -1;
      }
      if (!animate) ALBUM.lastDir = 0;
      ALBUM.lastSlideAt = performance.now();
      renderPaperAlbum();
    }

    function bindPaperSwipe(stage) {
      let drag = null;
      let settling = false;
      let suppressClick = false;
      const mobile = matchMedia('(max-width: 768px)');
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
      function drawTurn(turn, clientX) {
        const distance = (turn.x - clientX) * turn.direction;
        const progress = Math.max(0, Math.min(1, distance / turn.travel));
        turn.sheet.style.transform = `rotateY(${-turn.direction * progress * 180}deg)`;
      }
      stage.addEventListener('pointerdown', e => {
        suppressClick = false;
        if (settling || !e.isPrimary || e.button !== 0 || e.target.isContentEditable || e.target.closest('button')) return;
        const page = stage.querySelector('.paper-spread.active, .paper-cover-wrap');
        drag = { id: e.pointerId, x: e.clientX, y: e.clientY, page, travel: page?.clientWidth * 0.72 };
      });
      stage.addEventListener('pointermove', e => {
        if (drag?.id !== e.pointerId || !drag.page) return;
        const dx = e.clientX - drag.x;
        if (!drag.direction) {
          if (Math.abs(dx) < 12 || Math.abs(dx) <= Math.abs(e.clientY - drag.y)) return;
          drag.direction = dx < 0 ? 1 : -1;
          suppressClick = true;
          stage.setPointerCapture(e.pointerId);
          if (!mobile.matches || reducedMotion.matches) return;

          const target = stage.querySelector(`[data-spread-index="${ALBUM.spreadIndex + drag.direction}"]`);
          if (!target || ALBUM.isCover) return;
          const side = drag.direction === 1 ? 1 : 0;
          const directionClass = side ? 'paper-turn-next' : 'paper-turn-prev';
          const reveal = document.createElement('div');
          reveal.className = `paper-turn-reveal ${directionClass}`;
          const sheet = document.createElement('div');
          sheet.className = `paper-turn-sheet ${directionClass}`;
          for (const layer of [reveal, sheet]) {
            layer.setAttribute('aria-hidden', 'true');
            layer.inert = true;
          }
          reveal.append(target.children[side].cloneNode(true));
          sheet.append(drag.page.children[side].cloneNode(true), target.children[1 - side].cloneNode(true));
          drag.page.classList.add('turning');
          drag.page.append(reveal, sheet);
          drag.sheet = sheet;
          drag.reveal = reveal;
        }
        if (drag.sheet) {
          const turn = drag;
          turn.clientX = e.clientX;
          if (!turn.frame) {
            turn.frame = requestAnimationFrame(() => {
              turn.frame = 0;
              drawTurn(turn, turn.clientX);
            });
          }
        }
      });
      async function finish(e) {
        if (drag?.id !== e.pointerId) return;
        const turn = drag;
        drag = null;
        if (!turn.direction || !turn.page?.isConnected) return;
        const distance = (turn.x - e.clientX) * turn.direction;
        const commit = e.type === 'pointerup' && distance >= 45 && !(mobile.matches && (
          (ALBUM.isCover && turn.direction < 0) ||
          (!ALBUM.isCover && turn.direction > 0 && ALBUM.spreadIndex + 1 >= getAlbumSpreads().length)
        ));
        if (turn.sheet) {
          cancelAnimationFrame(turn.frame);
          drawTurn(turn, e.type === 'pointerup' ? e.clientX : turn.clientX);
          settling = true;
          const angle = commit ? -turn.direction * 180 : 0;
          const animation = turn.sheet.animate(
            [{ transform: turn.sheet.style.transform }, { transform: `rotateY(${angle}deg)` }],
            { duration: commit ? 230 : 170, easing: 'ease-out', fill: 'forwards' }
          );
          await animation.finished.catch(() => {});
          settling = false;
          turn.sheet.remove();
          turn.reveal.remove();
          turn.page.classList.remove('turning');
        }
        if (commit && ALBUM.open && turn.page.isConnected) {
          stepPaperSpread(turn.direction, !turn.sheet);
        }
      }
      stage.addEventListener('pointerup', finish);
      stage.addEventListener('pointercancel', finish);
      stage.addEventListener('click', e => {
        if (suppressClick && e.detail > 0) e.stopPropagation();
      }, true);
    }

    const PAPER_COVER_KEY = 'StarlightTreeV2_PaperCover';
    let cachedDefaultCoverURL = null;

    // 高定 2x 水彩厚涂 + 暖金焦外 + 落雪圣诞树封面贴图（纯本地 Canvas 精绘，发朋友圈级质感）
    function getInsChristmasCoverURL() {
      try {
        const custom = localStorage.getItem(PAPER_COVER_KEY);
        if (custom) return custom;
      } catch {}
      if (cachedDefaultCoverURL) return cachedDefaultCoverURL;

      const W = 720, H = 1020;
      const cv = document.createElement('canvas');
      cv.width = W; cv.height = H;
      const ctx = cv.getContext('2d');

      // 1. 深邃圣诞松绿天鹅绒夜空渐变 + 顶部微光
      const bg = ctx.createRadialGradient(W * 0.5, H * 0.40, 40, W * 0.5, H * 0.45, H * 0.72);
      bg.addColorStop(0, '#245240');
      bg.addColorStop(0.48, '#133126');
      bg.addColorStop(1, '#081712');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      // 2. 梦幻暖金/酒红焦外光斑（INS 氛围核心）
      const bokehs = [
        [130, 210, 74, 'rgba(246,216,150,0.16)'], [590, 190, 92, 'rgba(246,216,150,0.14)'],
        [95, 510, 56, 'rgba(186,52,66,0.18)'], [620, 490, 68, 'rgba(246,216,150,0.14)'],
        [160, 760, 82, 'rgba(246,216,150,0.15)'], [575, 740, 76, 'rgba(186,52,66,0.16)'],
        [360, 310, 190, 'rgba(248,224,168,0.15)']
      ];
      bokehs.forEach(([x, y, r, col]) => {
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      });

      // 3. 底部柔和雪坡
      const snowG = ctx.createLinearGradient(0, 720, 0, 860);
      snowG.addColorStop(0, 'rgba(245,248,250,0.22)');
      snowG.addColorStop(1, 'rgba(14,32,25,0.0)');
      ctx.fillStyle = snowG;
      ctx.beginPath();
      ctx.ellipse(W * 0.5, 785, 310, 68, 0, 0, Math.PI * 2);
      ctx.fill();

      // 4. 树干
      const trunkG = ctx.createLinearGradient(338, 0, 382, 0);
      trunkG.addColorStop(0, '#442616'); trunkG.addColorStop(0.5, '#6e4126'); trunkG.addColorStop(1, '#361d10');
      ctx.fillStyle = trunkG;
      ctx.fillRect(342, 726, 36, 62);

      // 5. 厚涂水彩风丰满冷杉松枝（14 层自然层叠笔触 + 枝梢霜雪）
      let seed = 8848;
      const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
      const topY = 215, botY = 742;
      for (let tier = 0; tier < 15; tier++) {
        const t = tier / 14;
        const y = topY + t * (botY - topY);
        const halfW = 24 + Math.pow(t, 0.92) * 238;
        const sprigs = 7 + Math.floor(t * 14);
        for (let s = 0; s < sprigs; s++) {
          const u = (s / (sprigs - 1)) * 2 - 1; // -1..1
          const bx = W * 0.5 + u * halfW * (0.86 + rnd() * 0.22);
          const by = y + Math.abs(u) * 24 + (rnd() - 0.5) * 14;
          const len = 34 + t * 38 + rnd() * 18;
          const ang = Math.PI * 0.5 + u * 0.72 + (rnd() - 0.5) * 0.25;
          // 深松绿暗底笔触
          ctx.save();
          ctx.translate(bx, by);
          ctx.rotate(ang);
          const shade = Math.floor(42 + (1 - Math.abs(u) * 0.4) * 44 + rnd() * 20);
          ctx.fillStyle = `rgb(${Math.floor(shade * 0.36)}, ${shade + 22}, ${Math.floor(shade * 0.76)})`;
          ctx.beginPath();
          ctx.ellipse(0, len * 0.32, 13 + t * 8, len * 0.58, 0, 0, Math.PI * 2);
          ctx.fill();
          // 松针霜白高光笔触
          if (rnd() > 0.35) {
            ctx.fillStyle = 'rgba(232, 242, 238, 0.32)';
            ctx.beginPath();
            ctx.ellipse(-2, len * 0.45, 7 + t * 4, len * 0.28, 0, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }
      }

      // 6. 暖金缠绕丝带灯串（S形绕树）
      for (let k = 0; k < 5; k++) {
        const t0 = 0.14 + k * 0.18;
        const y0 = topY + t0 * (botY - topY);
        const w0 = 26 + Math.pow(t0, 0.92) * 218;
        ctx.save();
        ctx.strokeStyle = 'rgba(248, 224, 165, 0.78)';
        ctx.lineWidth = 3.2;
        ctx.shadowColor = '#f5ce78';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.moveTo(W * 0.5 - w0, y0 - 10);
        ctx.quadraticCurveTo(W * 0.5, y0 + 46, W * 0.5 + w0, y0 - 4);
        ctx.stroke();
        ctx.restore();

        // 沿灯串点缀暖金微光珠
        for (let d = 0; d <= 10; d++) {
          const f = d / 10;
          const lx = (1 - f) * (W * 0.5 - w0) + f * (W * 0.5 + w0);
          const ly = (1 - f) * (1 - f) * (y0 - 10) + 2 * (1 - f) * f * (y0 + 46) + f * f * (y0 - 4);
          const lg = ctx.createRadialGradient(lx, ly, 0, lx, ly, 16);
          lg.addColorStop(0, 'rgba(255,250,230,0.95)');
          lg.addColorStop(0.35, 'rgba(246,208,124,0.45)');
          lg.addColorStop(1, 'rgba(246,208,124,0)');
          ctx.fillStyle = lg;
          ctx.beginPath(); ctx.arc(lx, ly, 16, 0, Math.PI * 2); ctx.fill();
        }
      }

      // 7. 酒红丝绒球、香槟金镜面球与珍珠饰品
      for (let o = 0; o < 28; o++) {
        const t = 0.14 + rnd() * 0.80;
        const oy = topY + t * (botY - topY);
        const maxW = (20 + Math.pow(t, 0.92) * 205) * 0.85;
        const ox = W * 0.5 + (rnd() * 2 - 1) * maxW;
        const or = 8 + rnd() * 6;
        const isRed = o % 2 === 0;
        const og = ctx.createRadialGradient(ox - or * 0.3, oy - or * 0.3, 1, ox, oy, or);
        if (isRed) {
          og.addColorStop(0, '#f07c86'); og.addColorStop(0.45, '#a82231'); og.addColorStop(1, '#540d16');
        } else {
          og.addColorStop(0, '#fff7de'); og.addColorStop(0.5, '#dfb868'); og.addColorStop(1, '#7c5820');
        }
        ctx.fillStyle = og;
        ctx.beginPath(); ctx.arc(ox, oy, or, 0, Math.PI * 2); ctx.fill();
      }

      // 8. 树底精致丝绒礼盒
      const gifts = [
        { x: 222, y: 726, w: 68, h: 56, c: '#8f222d', r: '#f2d8a3' },
        { x: 298, y: 742, w: 52, h: 44, c: '#d8b46a', r: '#8f222d' },
        { x: 396, y: 736, w: 60, h: 50, c: '#1f4c3a', r: '#f2d8a3' },
        { x: 462, y: 728, w: 54, h: 56, c: '#9e2a36', r: '#faf4ea' }
      ];
      gifts.forEach(g => {
        ctx.fillStyle = g.c;
        ctx.beginPath(); ctx.roundRect(g.x, g.y, g.w, g.h, 6); ctx.fill();
        ctx.fillStyle = g.r;
        ctx.fillRect(g.x + g.w * 0.44, g.y, g.w * 0.12, g.h);
        ctx.fillRect(g.x, g.y + g.h * 0.42, g.w, g.h * 0.14);
      });

      // 9. 树顶璀璨香槟金圣诞星 + 光芒
      const sx = W * 0.5, sy = 192;
      const starGlow = ctx.createRadialGradient(sx, sy, 4, sx, sy, 86);
      starGlow.addColorStop(0, 'rgba(255,248,220,0.92)');
      starGlow.addColorStop(0.35, 'rgba(245,206,120,0.38)');
      starGlow.addColorStop(1, 'rgba(245,206,120,0)');
      ctx.fillStyle = starGlow;
      ctx.beginPath(); ctx.arc(sx, sy, 86, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = '#fae5b4';
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const rad = i % 2 === 0 ? 34 : 13;
        const a = (i / 10) * Math.PI * 2 - Math.PI / 2;
        if (i === 0) ctx.moveTo(sx + Math.cos(a) * rad, sy + Math.sin(a) * rad);
        else ctx.lineTo(sx + Math.cos(a) * rad, sy + Math.sin(a) * rad);
      }
      ctx.closePath(); ctx.fill();

      // 10. 漫天细碎落雪星尘
      for (let i = 0; i < 110; i++) {
        const px = rnd() * W, py = rnd() * H;
        const pr = 1 + rnd() * 2.6;
        ctx.fillStyle = `rgba(255, 250, 240, ${0.25 + rnd() * 0.6})`;
        ctx.beginPath(); ctx.arc(px, py, pr, 0, Math.PI * 2); ctx.fill();
      }

      cachedDefaultCoverURL = cv.toDataURL('image/jpeg', 0.90);
      return cachedDefaultCoverURL;
    }

    function renderPaperAlbum() {
      const stage = document.getElementById('paper-stage');
      const countLabel = document.getElementById('album-count-label');
      const spreads = getAlbumSpreads();
      ALBUM.spreadIndex = Math.max(0, Math.min(ALBUM.spreadIndex, spreads.length - 1));
      stage.innerHTML = '';

      const isMob = window.innerWidth <= 768;
      const title = document.getElementById('paper-album-title');
      title.contentEditable = isMob ? 'false' : 'true';
      const titleText = title.textContent.trim() || '2026 圣诞回忆手账';

      if (ALBUM.isCover) {
        countLabel.textContent = `共 ${spreads.length} 个跨页 · ${photoRecords.length} 张照片 · 点击封面翻开`;
        const cover = document.createElement('div');
        cover.className = 'paper-cover-wrap';
        cover.tabIndex = 0;
        cover.setAttribute('role', 'button');
        cover.setAttribute('aria-label', '翻开相册');
        cover.innerHTML = `
          <div class="paper-cover-spine">
            <span class="spine-dot"></span>
            <span class="spine-dot"></span>
          </div>
          <div class="paper-cover-face">
            <img class="paper-cover-art" src="${getInsChristmasCoverURL()}" alt="Christmas Cover">
            <div class="paper-cover-vignette"></div>
            <div class="paper-cover-frame"></div>
            <div class="paper-cover-badge">DEC 25 · 2026</div>
            <div class="paper-cover-titles">
              <div class="paper-cover-en">Merry Christmas</div>
              <div class="paper-cover-cn">${titleText}</div>
              <div class="paper-cover-cta">✦ 点击翻开圣诞手账 ✦</div>
            </div>
          </div>`;
        cover.onclick = () => {
          ALBUM.isCover = false;
          ALBUM.spreadIndex = 0;
          ALBUM.lastDir = 1;
          renderPaperAlbum();
        };
        cover.onkeydown = e => {
          if (e.key === 'Enter' || e.code === 'Space') {
            e.preventDefault();
            e.stopPropagation();
            cover.click();
          }
        };
        stage.appendChild(cover);
        return;
      }

      countLabel.textContent = `第 ${ALBUM.spreadIndex + 1} / ${spreads.length} 跨页 · 共 ${photoRecords.length} 张照片`;
      const deck = document.createElement('div');
      deck.className = 'paper-book-deck';
      const stepX = isMob ? 18 : 36;

      spreads.forEach((pair, i) => {
        const diff = i - ALBUM.spreadIndex;
        if (Math.abs(diff) > 5) return; // 最多左右各露 5 页景深层叠，保持精致与流畅
        const el = document.createElement('div');
        el.className = 'paper-spread';
        if (i === 0) el.classList.add('first-edge');
        if (i === spreads.length - 1) el.classList.add('last-edge');
        el.dataset.spreadIndex = i;
        if (diff === 0) {
          el.classList.add('active');
          if (ALBUM.lastDir > 0) el.classList.add('flip-next');
          else if (ALBUM.lastDir < 0) el.classList.add('flip-prev');
        }

        const absD = Math.abs(diff);
        const tx = diff === 0 ? 0 : (Math.sign(diff) * (isMob ? 26 : 54) + diff * stepX);
        const sc = Math.max(0.76, 1 - absD * 0.045);
        const ry = diff === 0 ? 0 : (diff < 0 ? 7 : -7);
        const zi = 30 - absD * 3;
        el.style.zIndex = zi;
        el.style.transform = `translateX(${tx}px) scale(${sc}) rotateY(${ry}deg)`;
        el.style.filter = diff === 0 ? 'none' : `brightness(${Math.max(0.62, 0.92 - absD * 0.07)})`;

        el.innerHTML = buildSpreadHTML(pair, i);
        if (isMob) el.querySelectorAll('[contenteditable]').forEach(note => note.removeAttribute('contenteditable'));
        if (diff !== 0) {
          el.onclick = () => {
            ALBUM.lastDir = diff > 0 ? 1 : -1;
            ALBUM.spreadIndex = i;
            renderPaperAlbum();
          };
        } else {
          bindPhotoBoxActions(el);
        }
        deck.appendChild(el);
      });

      stage.appendChild(deck);
      ALBUM.lastDir = 0;
    }

    // 一键导出高审美 INS 圣诞手账跨页 PNG（直接发朋友圈！）
    function exportCurrentSpreadPoster() {
      const spreads = getAlbumSpreads();
      const pair = spreads[ALBUM.spreadIndex] || [];
      const titleText = document.getElementById('paper-album-title').textContent.trim() || '2026 圣诞回忆手账';
      const noteText = ALBUM.notes[ALBUM.spreadIndex] || DEFAULT_XMAS_NOTES[ALBUM.spreadIndex % DEFAULT_XMAS_NOTES.length];

      const W = 1200, H = 900;
      const cv = document.createElement('canvas');
      cv.width = W; cv.height = H;
      const ctx = cv.getContext('2d');

      // INS 圣诞深松绿高级背景 + 暖金微光
      const bg = ctx.createRadialGradient(W * 0.5, H * 0.45, 60, W * 0.5, H * 0.5, W * 0.72);
      bg.addColorStop(0, '#224537');
      bg.addColorStop(1, '#0d1b16');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      // 飘雪星点
      ctx.fillStyle = 'rgba(246, 225, 184, 0.45)';
      for (let i = 0; i < 65; i++) {
        const sx = (i * 197) % W, sy = (i * 131) % H;
        ctx.beginPath(); ctx.arc(sx, sy, 1.2 + (i % 3) * 0.9, 0, Math.PI * 2); ctx.fill();
      }

      // 顶部标题
      ctx.fillStyle = '#faf4ea';
      ctx.font = '500 32px "LXGW WenKai", "Noto Serif SC", serif';
      ctx.textAlign = 'center';
      ctx.fillText(titleText, W / 2, 74);
      ctx.fillStyle = '#e5c687';
      ctx.font = '14px "Cinzel", serif';
      ctx.fillText('MERRY CHRISTMAS  ·  DEC 25, 2026', W / 2, 102);

      // 中央手账跨页卡片
      const bx = 110, by = 136, bw = 980, bh = 640;
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.55)';
      ctx.shadowBlur = 46;
      ctx.shadowOffsetY = 20;
      ctx.fillStyle = '#faf4ea';
      ctx.beginPath();
      ctx.roundRect(bx, by, bw, bh, 24);
      ctx.fill();
      ctx.restore();

      const drawAndFinish = (img1, img2) => {
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(bx, by, bw, bh, 24);
        ctx.clip();

        // 左页照片满幅裁切
        if (img1) {
          const halfW = bw / 2;
          const sc = Math.max(halfW / img1.width, bh / img1.height);
          const dw = img1.width * sc, dh = img1.height * sc;
          ctx.drawImage(img1, bx + (halfW - dw) / 2, by + (bh - dh) / 2, dw, dh);
        }

        // 右页奶油棉纸 + 标题 + 拍立得 + 文案
        const rx = bx + bw / 2;
        ctx.fillStyle = '#faf4ea';
        ctx.fillRect(rx, by, bw / 2, bh);

        ctx.fillStyle = '#8f222d';
        ctx.font = 'italic 44px "Great Vibes", Georgia, serif';
        ctx.textAlign = 'left';
        ctx.fillText('Merry & Bright', rx + 42, by + 76);

        ctx.fillStyle = '#1d4234';
        ctx.font = '600 13px "Cinzel", serif';
        ctx.fillText('CHRISTMAS JOURNAL  ·  NO.' + String(ALBUM.spreadIndex + 1).padStart(2, '0'), rx + 44, by + 104);

        if (img2) {
          const px = rx + 58, py = by + 132, pw = 374, ph = 282;
          ctx.save();
          ctx.shadowColor = 'rgba(34,22,14,0.18)';
          ctx.shadowBlur = 18;
          ctx.fillStyle = '#fffdf9';
          ctx.fillRect(px - 10, py - 10, pw + 20, ph + 44);
          ctx.restore();
          const sc2 = Math.max(pw / img2.width, ph / img2.height);
          const dw2 = img2.width * sc2, dh2 = img2.height * sc2;
          ctx.save();
          ctx.beginPath(); ctx.rect(px, py, pw, ph); ctx.clip();
          ctx.drawImage(img2, px + (pw - dw2) / 2, py + (ph - dh2) / 2, dw2, dh2);
          ctx.restore();
        }

        // 手写文案自动换行
        ctx.fillStyle = '#463c35';
        ctx.font = '20px "LXGW WenKai", "KaiTi", serif';
        const maxW = 404;
        let line = '', ly = by + 485;
        for (const ch of noteText) {
          if (ctx.measureText(line + ch).width > maxW) {
            ctx.fillText(line, rx + 44, ly);
            line = ch; ly += 32;
            if (ly > by + bh - 44) break;
          } else line += ch;
        }
        if (line && ly <= by + bh - 30) ctx.fillText(line, rx + 44, ly);

        // 中缝立体阴影
        const gMid = ctx.createLinearGradient(rx - 22, 0, rx + 22, 0);
        gMid.addColorStop(0, 'rgba(0,0,0,0)');
        gMid.addColorStop(0.5, 'rgba(20,12,8,0.22)');
        gMid.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = gMid;
        ctx.fillRect(rx - 22, by, 44, bh);
        ctx.restore();

        // 底部水印
        ctx.fillStyle = 'rgba(242, 216, 163, 0.75)';
        ctx.font = '13px "Cinzel", serif';
        ctx.textAlign = 'center';
        ctx.fillText('STARLIGHT CHRISTMAS  ·  HANDCRAFTED MEMORY JOURNAL', W / 2, H - 46);

        const a = document.createElement('a');
        a.download = `圣诞手账_第${ALBUM.spreadIndex + 1}页.png`;
        a.href = cv.toDataURL('image/png');
        a.click();
      };

      const loadImg = src => new Promise(res => {
        if (!src) return res(null);
        const im = new Image();
        im.crossOrigin = 'anonymous';
        im.onload = () => res(im);
        im.onerror = () => res(null);
        im.src = src;
      });
      Promise.all([loadImg(pair[0]?.data), loadImg((pair[1] || pair[0])?.data)]).then(([i1, i2]) => drawAndFinish(i1, i2));
    }

    function updateAlbumBeatEngine(now) {
      if (!ALBUM.open || !ALBUM.playing) return;
      let energy = 0;
      if (analyser && freqBins && isMusicPlaying) {
        analyser.getByteFrequencyData(freqBins);
        let low = 0;
        for (let i = 0; i < 8; i++) low += freqBins[i];
        energy = low / (8 * 255);
      } else {
        const phase = ((now % 555) / 555);
        energy = phase < 0.16 ? 0.78 : 0.22;
      }
      const isBeat = energy > 0.56 && (now - ALBUM.lastBeatAt > 480);
      if (isBeat && (now - ALBUM.lastSlideAt > 2800)) {
        ALBUM.lastBeatAt = now;
        stepPaperSpread(1);
      } else if (now - ALBUM.lastSlideAt > 4600) {
        stepPaperSpread(1);
      }
    }

    /* ==================== 主动画循环 ==================== */
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const et = clock.elapsedTime;
      const now = performance.now();
      const mobileAlbumOpen = IS_MOBILE && ALBUM.open;

      // 1. 相机固定仰角，仅平滑调整水平构图（PC 树偏左、手机居中）与缩放 z
      const targetCamX = (!IS_MOBILE && !STATE.introPlaying && STATE.mode === 'TREE') ? 4.6 : 0;
      camera.position.x = THREE.MathUtils.lerp(camera.position.x, targetCamX, Math.min(1, dt * 2.2));
      camera.position.y = CONFIG.camera.y;
      camera.position.z = THREE.MathUtils.lerp(camera.position.z, STATE.targetZoom, Math.min(1, dt * 7));

      if (!mobileAlbumOpen) {
        if (STATE.introPlaying) updateIntroOverlay(dt);
        updateWillowFireworks(dt);
        updateFirefliesAndMeteors(dt, et);
        renderParticleTextLayer(dt, now);
      }
      updateAlbumBeatEngine(now);

      // 2. 严格锁定仅水平 Y 轴旋转（rotation.x 永远为 0！）
      if (manualDirY !== 0) {
        STATE.rotY += manualDirY * CONFIG.interaction.rotationSpeed * 1.8 * dt;
      } else {
        const decay = Math.pow(0.90, dt * 60);
        STATE.rotY += STATE.velY * (1 - decay) / 0.10;
        STATE.velY *= decay;
        if (STATE.mode === 'SCATTER' && STATE.hand.detected) {
          const th = 0.30;
          if (Math.abs(STATE.hand.x) > th) {
            STATE.rotY -= CONFIG.interaction.rotationSpeed * 0.9 * dt * (STATE.hand.x - Math.sign(STATE.hand.x) * th);
          }
        } else if (STATE.mode === 'SCATTER' && STATE.autoRotate) {
          STATE.rotY += 0.10 * dt * CONFIG.interaction.rotationSpeed;
        }
      }
      if (STATE.mode === 'TREE') STATE.rotY += 0.20 * dt * CONFIG.interaction.rotationSpeed;
      mainGroup.rotation.x = 0; // 硬锁俯仰角！
      mainGroup.rotation.z = 0;
      mainGroup.rotation.y = STATE.rotY;
      // 手机相册盖住场景时沿用最后一帧，树的旋转角度继续更新。
      if (mobileAlbumOpen) return;

      // 3. GPU 形态插值（0=树形，1=散开星云）
      const targetMorph = (STATE.introPlaying && STATE.introTime < 3.2) || STATE.mode !== 'TREE' ? 1 : 0;
      STATE.morph = THREE.MathUtils.lerp(STATE.morph, targetMorph, Math.min(1, dt * (STATE.introPlaying ? 2.2 : 3.8)));
      const treeOpacity = 1 - THREE.MathUtils.smoothstep(STATE.morph, 0.02, 0.65);
      for (const { points, mat } of scatterLayers) {
        points.visible = treeOpacity < 0.999;
        mat.uniforms.uTime.value = et;
        mat.uniforms.uMorph.value = STATE.morph;
        mat.uniforms.uOpacity.value = 1 - treeOpacity;
      }
      drawSilverTree(et, STATE.rotY % (2 * Math.PI), treeOpacity);

      // 同心光环、玩偶与礼盒
      const treeOnlyScale = Math.max(0.001, 1 - STATE.morph * 1.35);
      if (groundRingsPoints) {
        groundRingsPoints.visible = !STATE.introPlaying && treeOnlyScale > 0.05;
        groundRingsPoints.rotation.y = -et * 0.06;
      }
      if (basePropsGroup) {
        const ps = !STATE.introPlaying ? treeOnlyScale : 0.001;
        basePropsGroup.scale.setScalar(ps);
        basePropsGroup.visible = ps > 0.03;
        if (basePropsGroup.visible) {
          for (const d of animatedDolls) {
            if (d.head) d.head.rotation.z = Math.sin(et * 1.9 + d.phase) * 0.06;
            if (d.waveArm) d.waveArm.rotation.z = -2.25 + Math.sin(et * 4.2 + d.phase) * 0.25;
            if (d.waddle) d.root.rotation.z = Math.sin(et * 2.2 + d.phase) * 0.05;
          }
        }
      }
      if (starField) starField.rotation.y = et * 0.008;

      // 5. 3D 照片卡片平滑动画（散开放大，点击单图飞到镜头中央）
      mainGroup.updateMatrixWorld();
      const invMat = inverseGroupMatrix.copy(mainGroup.matrixWorld).invert();
      for (const rec of photoRecords) {
        let targetPos = STATE.mode === 'TREE' ? rec.posTree : rec.posScatter;
        let targetScale = STATE.mode === 'TREE' ? 0.58 : 1.75;

        if (STATE.mode === 'FOCUS') {
          if (rec.group === STATE.focusTarget) {
            const frontZ = Math.max(12, camera.position.z - 13.5);
            targetPos = new THREE.Vector3(camera.position.x, camera.position.y + 0.4, frontZ).applyMatrix4(invMat);
            targetScale = IS_MOBILE ? 2.6 : 3.4;
          } else {
            targetPos = rec.posScatter;
            targetScale = 0.65;
          }
        }
        const rate = (STATE.mode === 'FOCUS' && rec.group === STATE.focusTarget) ? 8.0 : 4.2;
        rec.group.position.lerp(targetPos, Math.min(1, dt * rate));
        const ns = THREE.MathUtils.lerp(rec.group.scale.x, targetScale, Math.min(1, dt * 6));
        rec.group.scale.setScalar(ns);
        if (STATE.mode === 'FOCUS' && rec.group === STATE.focusTarget) {
          rec.group.lookAt(camera.position);
        } else {
          rec.group.lookAt(camera.position.x, rec.group.position.y, camera.position.z);
        }
      }

      // 6. 柔焦飘雪
      if (snowPoints) {
        snowPoints.visible = STATE.mode !== 'FOCUS';
        if (snowPoints.visible) {
          const arr = snowPoints.geometry.attributes.position.array;
          for (let i = 0; i < snowData.length; i++) {
            const s = snowData[i];
            s.y -= s.vy * CONFIG.snow.speed * dt;
            s.x += Math.sin(et * 0.6 + s.drift) * 1.2 * dt;
            if (s.y < -25) {
              s.y = 40;
              s.x = (Math.random() - 0.5) * CONFIG.snow.range;
              s.z = (Math.random() - 0.5) * CONFIG.snow.range;
            }
            arr[i * 3] = s.x; arr[i * 3 + 1] = s.y; arr[i * 3 + 2] = s.z;
          }
          snowPoints.geometry.attributes.position.needsUpdate = true;
        }
      }

      composer.render();
    }

    /* ==================== 画布交互（仅水平拖拽 + 滚轮/双指缩放 + 点击单图聚焦） ==================== */
    function setupCanvasInteraction() {
      const el = renderer.domElement;
      let dragging = false, moved = 0, prevX = 0;
      let pinchStartDist = 0, pinchStartZoom = CONFIG.camera.z;
      const pointers = new Map();

      el.addEventListener('pointerdown', e => {
        if (pointers.size >= 2 || (e.pointerType === 'mouse' && e.button !== 0)) return;
        el.setPointerCapture(e.pointerId);
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (pointers.size === 1) {
          STATE.velY = 0;
          dragging = true; moved = 0; prevX = e.clientX;
        } else if (pointers.size === 2) {
          dragging = false;
          const pts = [...pointers.values()];
          pinchStartDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
          pinchStartZoom = STATE.targetZoom;
        }
      });

      window.addEventListener('pointermove', e => {
        const previous = pointers.get(e.pointerId);
        if (!previous) return;
        previous.prevY = previous.y;
        previous.x = e.clientX;
        previous.y = e.clientY;
        if (pointers.size === 2) {
          const pts = [...pointers.values()];
          const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
          if (pinchStartDist > 10 && d > 10) {
            STATE.targetZoom = THREE.MathUtils.clamp(pinchStartZoom * (pinchStartDist / d), CONFIG.camera.minZ, CONFIG.camera.maxZ);
          }
          return;
        }
        if (!dragging) return;
        const dx = e.clientX - prevX;
        const prevY = previous.prevY;
        moved += Math.hypot(dx, e.clientY - prevY);
        prevX = e.clientX;
        // 严格只读取水平位移 dx，完全忽略 dy！
        STATE.rotY += dx * 0.008;
      });

      const endPtr = e => {
        if (!pointers.has(e.pointerId)) return;
        const isTap = e.type === 'pointerup' && pointers.size === 1 && dragging && moved < 7;
        pointers.delete(e.pointerId);
        dragging = pointers.size === 1;
        if (dragging) {
          prevX = pointers.values().next().value.x;
          moved = 7;
        }

        if (isTap && !STATE.introPlaying) {
          pointerNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
          pointerNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
          raycaster.setFromCamera(pointerNDC, camera);
          const hits = raycaster.intersectObjects(photoMeshGroup.children, true);
          if (hits.length > 0 && hits[0].object.userData.photoGroup) {
            const grp = hits[0].object.userData.photoGroup;
            if (STATE.mode === 'FOCUS' && STATE.focusTarget === grp) setMode('SCATTER');
            else setMode('FOCUS', grp);
          } else if (STATE.mode === 'FOCUS') {
            setMode('SCATTER');
          }
        }
      };
      window.addEventListener('pointerup', endPtr);
      window.addEventListener('pointercancel', endPtr);
      el.addEventListener('lostpointercapture', endPtr);

      el.addEventListener('wheel', e => {
        e.preventDefault();
        STATE.targetZoom = THREE.MathUtils.clamp(STATE.targetZoom + e.deltaY * 0.03, CONFIG.camera.minZ, CONFIG.camera.maxZ);
      }, { passive: false });
    }

    /* ==================== MediaPipe 手势识别（全 jsDelivr + 仅水平旋转） ==================== */
    const HANDS_CDN = 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240';
    let videoEl = null, handsDetector = null, camStream = null, camRunning = false;
    let lastVideoTime = -1, sendingFrame = false, latestLandmarks = null;

    const G_STATE = {
      smoothX: 0, hasPrev: false, candidate: 'NONE', stableFrames: 0,
      activeGesture: 'NONE', lastSwitchAt: 0, lastGrabAt: 0, releaseFrames: 0
    };

    function dist2D(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
    function setCamDot(on) { document.getElementById('cam-status').classList.toggle('active', !!on); }
    function setCamBadge(t) { const el = document.getElementById('cam-gesture-badge'); if (el) el.textContent = t; }

    function classifyHandPose(lm) {
      const wrist = lm[0];
      const palm = dist2D(wrist, lm[9]) || 0.001;
      const fingers = [[8, 6, 5], [12, 10, 9], [16, 14, 13], [20, 18, 17]];
      const ext = [false, false, false, false];
      let ext4 = 0, curl4 = 0, otherExt = 0, tipSum = 0;

      fingers.forEach(([tip, pip, mcp], idx) => {
        const dT = dist2D(lm[tip], wrist), dP = dist2D(lm[pip], wrist), dM = dist2D(lm[mcp], wrist);
        tipSum += dT / palm;
        if (dT > dP * 1.12 && dT > dM * 1.25) {
          ext[idx] = true; ext4++;
          if (idx >= 1) otherExt++;
        }
        if (dT < dP * 1.04) curl4++;
      });
      const pinch = dist2D(lm[4], lm[8]) / palm;

      // 1. ✊ 握拳（最高优先级）
      if (curl4 >= 3 && ext4 === 0 && (tipSum / 4) < 1.38) return 'FIST';
      // 2. ☝️ 单指指向（仅食指伸直，中指/无名指/小指弯曲 -> 精准指哪张出哪张！）
      if (ext[0] && !ext[1] && !ext[2] && !ext[3] && pinch > 0.42) return 'POINT';
      // 3. 👌 OK 捏合（拇指食指靠拢 + 其余手指自然张开 -> 展开扇形相册集！）
      if (pinch < 0.36 && otherExt >= 2) return 'PINCH';
      // 4. 🖐️ 张开五指 -> 散开星云
      if (ext4 >= 4 && pinch > 0.45) return 'OPEN';
      return 'NEUTRAL';
    }

    function pickPhotoAtScreenPoint(sx, sy) {
      if (!photoRecords.length) return null;
      pointerNDC.x = (sx / window.innerWidth) * 2 - 1;
      pointerNDC.y = -(sy / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointerNDC, camera);
      const hits = raycaster.intersectObjects(photoMeshGroup.children, true);
      if (hits.length > 0 && hits[0].object.userData.photoGroup) {
        return hits[0].object.userData.photoGroup;
      }
      // 容错：找屏幕坐标离指尖最近的一张（半径 120px 内）
      let best = null, bestPx = 120;
      const v = new THREE.Vector3();
      for (const r of photoRecords) {
        r.group.updateMatrixWorld();
        r.group.getWorldPosition(v);
        v.project(camera);
        if (v.z >= 1) continue;
        const px = (v.x * 0.5 + 0.5) * window.innerWidth;
        const py = (-v.y * 0.5 + 0.5) * window.innerHeight;
        const dist = Math.hypot(px - sx, py - sy);
        if (dist < bestPx) { bestPx = dist; best = r.group; }
      }
      return best;
    }

    function processGestures(lms, now) {
      if (ALBUM.open) return;
      const lm = lms?.[0];
      const pose = lm ? classifyHandPose(lm) : 'NONE';
      // Wait for a fresh gesture after closing the album.
      if (G_STATE.releaseFrames > 0) {
        G_STATE.releaseFrames = pose === 'NONE' || pose === 'NEUTRAL' ? G_STATE.releaseFrames - 1 : 3;
        if (G_STATE.releaseFrames === 0) setCamBadge('手势已恢复');
        return;
      }
      const cursorEl = document.getElementById('finger-cursor');
      if (!lm) {
        STATE.hand.detected = false;
        G_STATE.hasPrev = false;
        G_STATE.candidate = 'NONE';
        G_STATE.stableFrames = 0;
        if (cursorEl) cursorEl.style.display = 'none';
        setCamDot(false); setCamBadge('未检测到手');
        return;
      }
      STATE.hand.detected = true; setCamDot(true);

      const rawX = (lm[9].x - 0.5) * 2;
      if (!G_STATE.hasPrev) { G_STATE.smoothX = rawX; G_STATE.hasPrev = true; }
      else {
        const prevX = G_STATE.smoothX;
        G_STATE.smoothX += (rawX - prevX) * 0.28;
        if (STATE.mode === 'SCATTER' && G_STATE.activeGesture === 'OPEN') {
          const dx = G_STATE.smoothX - prevX;
          if (Math.abs(dx) > 0.004) STATE.velY -= dx * 0.22 * CONFIG.interaction.rotationSpeed;
        }
      }
      STATE.hand.x = G_STATE.smoothX;

      if (pose === G_STATE.candidate) G_STATE.stableFrames++;
      else { G_STATE.candidate = pose; G_STATE.stableFrames = 1; }

      // 单指指向时实时显示食指星光准星（镜像 x）
      if (pose === 'POINT') {
        const sx = (1 - lm[8].x) * window.innerWidth;
        const sy = lm[8].y * window.innerHeight;
        if (cursorEl) {
          cursorEl.style.display = 'block';
          cursorEl.style.left = `${sx}px`;
          cursorEl.style.top = `${sy}px`;
        }
        if (G_STATE.stableFrames >= 3) {
          G_STATE.activeGesture = 'POINT';
          setCamBadge('☝️ 指图 · 精准聚焦');
          if (now - G_STATE.lastGrabAt > 700) {
            const targetGrp = pickPhotoAtScreenPoint(sx, sy);
            if (targetGrp && targetGrp !== STATE.focusTarget) {
              G_STATE.lastGrabAt = now;
              setMode('FOCUS', targetGrp);
            }
          }
        }
        return;
      } else if (cursorEl) {
        cursorEl.style.display = 'none';
      }

      if (G_STATE.stableFrames < 3 || pose === 'NEUTRAL') return;
      G_STATE.activeGesture = pose;

      if (pose === 'FIST') {
        setCamBadge('✊ 握拳 · 聚拢');
        if (now - G_STATE.lastSwitchAt > 400) {
          G_STATE.lastSwitchAt = now;
          if (STATE.mode !== 'TREE') setMode('TREE');
        }
      } else if (pose === 'OPEN') {
        setCamBadge('🖐️ 张手 · 散开');
        if (now - G_STATE.lastSwitchAt > 400) {
          G_STATE.lastSwitchAt = now;
          if (STATE.mode !== 'SCATTER') setMode('SCATTER');
        }
      } else if (pose === 'PINCH') {
        setCamBadge('👌 捏合 · 扇形相册');
        if (now - G_STATE.lastSwitchAt > 700) {
          G_STATE.lastSwitchAt = now;
          openAlbum('grid', 0);
        }
      }
    }

    function loadHandsScript() {
      if (window.Hands) return Promise.resolve();
      return new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = `${HANDS_CDN}/hands.js`; s.crossOrigin = 'anonymous';
        s.onload = res; s.onerror = () => rej(new Error('ScriptLoadError'));
        document.head.appendChild(s);
      });
    }
    function withTimeout(p, ms, name) {
      return Promise.race([p, new Promise((_, rej) => setTimeout(() => { const e = new Error(name); e.name = name; rej(e); }, ms))]);
    }

    async function startGesture() {
      const btn = document.getElementById('cam-enable');
      if (camRunning) { btn.style.display = 'none'; return; }
      if (!navigator.mediaDevices?.getUserMedia) {
        setGestureHint('当前环境不支持摄像头，请用 Chrome / Edge 打开');
        return;
      }
      try {
        btn.disabled = true; btn.textContent = '请求权限…';
        const sdk = loadHandsScript();
        camStream = await withTimeout(
          navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 480 }, height: { ideal: 360 }, facingMode: 'user' }, audio: false }),
          6000, 'CamTimeout'
        );
        videoEl = document.getElementById('webcam-video');
        videoEl.srcObject = camStream;
        await videoEl.play().catch(() => {});
        renderWebcamPreview();

        btn.textContent = '加载模型…';
        await withTimeout(sdk, 12000, 'ModelTimeout');
        handsDetector = new window.Hands({ locateFile: f => `${HANDS_CDN}/${f}` });
        handsDetector.setOptions({ maxNumHands: 1, modelComplexity: IS_MOBILE ? 0 : 1, minDetectionConfidence: 0.65, minTrackingConfidence: 0.6 });
        handsDetector.onResults(r => {
          const lms = r && r.multiHandLandmarks;
          latestLandmarks = (lms && lms.length) ? lms[0] : null;
          processGestures(lms, performance.now());
        });
        await withTimeout(handsDetector.send({ image: videoEl }), 15000, 'ModelTimeout');

        camRunning = true;
        btn.style.display = 'none';
        document.getElementById('cam-gesture-badge').style.display = 'block';
        setGestureHint('手势已开启：✊握拳=聚拢 · 🖐️张手=散开 · ☝️单指=指哪张出哪张 · 👌捏合=扇形相册');
        predictWebcam();
      } catch (e) {
        btn.disabled = false; btn.textContent = '重试启用';
        setGestureHint(e.name === 'CamTimeout' ? '摄像头授权超时，请用 Chrome / Edge 打开并允许权限' : '手势暂不可用，触控与鼠标交互不受影响');
      }
    }

    function renderWebcamPreview() {
      const c = document.getElementById('webcam-canvas');
      const ctx = c.getContext('2d');
      let lastPreviewTime = -1;
      const draw = () => {
        if (STATE.cameraVisible && videoEl && videoEl.readyState >= 2 && videoEl.currentTime !== lastPreviewTime) {
          lastPreviewTime = videoEl.currentTime;
          const sw = videoEl.videoWidth || c.width, sh = videoEl.videoHeight || c.height;
          const sc = Math.max(c.width / sw, c.height / sh);
          const dw = sw * sc, dh = sh * sc, ox = (c.width - dw) / 2, oy = (c.height - dh) / 2;
          ctx.drawImage(videoEl, ox, oy, dw, dh);
          if (latestLandmarks) {
            ctx.fillStyle = '#dceeff';
            for (const pt of latestLandmarks) {
              ctx.beginPath(); ctx.arc(ox + pt.x * dw, oy + pt.y * dh, 2.4, 0, Math.PI * 2); ctx.fill();
            }
          }
        }
        requestAnimationFrame(draw);
      };
      draw();
    }

    async function predictWebcam() {
      if (!handsDetector || !videoEl) return;
      if (!(IS_MOBILE && ALBUM.open) && !sendingFrame && videoEl.readyState >= 2 && videoEl.currentTime !== lastVideoTime) {
        lastVideoTime = videoEl.currentTime; sendingFrame = true;
        try { await handsDetector.send({ image: videoEl }); } catch {}
        sendingFrame = false;
      }
      requestAnimationFrame(predictWebcam);
    }

    /* ==================== 文案持久化与 UI 绑定 ==================== */
    let textTimer = null;
    function saveAndApplyText(immediate = false) {
      clearTimeout(textTimer);
      TEXT_ENGINE.enabled = document.getElementById('show-greeting').checked;
      TEXT_ENGINE.titleText = document.getElementById('input-line1').value;
      TEXT_ENGINE.subText = document.getElementById('input-line2').value;
      TEXT_ENGINE.blessingText = document.getElementById('input-blessing').value;
      TEXT_ENGINE.sizePct = parseInt(document.getElementById('slider-fontsize').value, 10) || 100;
      TEXT_ENGINE.colorHex = document.getElementById('color-picker').value;
      document.getElementById('fontsize-val').textContent = `${TEXT_ENGINE.sizePct}%`;
      try {
        localStorage.setItem('starlight_v2_text', JSON.stringify({
          line1: TEXT_ENGINE.titleText, line2: TEXT_ENGINE.subText,
          blessing: TEXT_ENGINE.blessingText, size: TEXT_ENGINE.sizePct, color: TEXT_ENGINE.colorHex,
          enabled: TEXT_ENGINE.enabled
        }));
      } catch {}
      if (!TEXT_ENGINE.enabled) {
        TEXT_ENGINE.active = false;
        document.getElementById('text-particle-canvas').style.opacity = '0';
        return;
      }
      if (immediate) {
        if (!STATE.introPlaying) startParticleTextAnimation();
      } else {
        textTimer = setTimeout(() => { if (!STATE.introPlaying) startParticleTextAnimation(); }, 550);
      }
    }

    function loadTextConfig() {
      let saved = null;
      try { saved = JSON.parse(localStorage.getItem('starlight_v2_text')); } catch {}
      TEXT_ENGINE.enabled = saved?.enabled !== false;
      TEXT_ENGINE.titleText = saved?.line1 ?? 'Merry Christmas';
      TEXT_ENGINE.subText = saved?.line2 ?? '愿你被温柔的时光照亮 · 2026';
      TEXT_ENGINE.blessingText = saved?.blessing ?? DEFAULT_BLESSING;
      TEXT_ENGINE.sizePct = saved?.size || 100;
      TEXT_ENGINE.colorHex = saved?.color || '#ffe8f0';

      document.getElementById('show-greeting').checked = TEXT_ENGINE.enabled;
      document.getElementById('input-line1').value = TEXT_ENGINE.titleText;
      document.getElementById('input-line2').value = TEXT_ENGINE.subText;
      document.getElementById('input-blessing').value = TEXT_ENGINE.blessingText;
      document.getElementById('slider-fontsize').value = TEXT_ENGINE.sizePct;
      document.getElementById('fontsize-val').textContent = `${TEXT_ENGINE.sizePct}%`;
      document.getElementById('color-picker').value = TEXT_ENGINE.colorHex;
    }

    function handlePhotoFiles(files) {
      if (!files || !files.length) return;
      const hasDefault = photoRecords.some(r => String(r.id).startsWith('default_'));
      if (hasDefault) {
        photoRecords.forEach(r => photoMeshGroup.remove(r.group));
        photoRecords = [];
      }
      Array.from(files).forEach(f => {
        const reader = new FileReader();
        reader.onload = ev => {
          const dataUrl = ev.target.result;
          const id = savePhotoToDB(dataUrl);
          addPhotoFromDataUrl(dataUrl, id);
        };
        reader.readAsDataURL(f);
      });
    }

    function syncUIVisibility() {
      document.getElementById('left-sidebar').classList.toggle('panel-hidden', !STATE.uiVisible);
      document.getElementById('toggle-ui-btn').textContent = STATE.uiVisible ? '🎛️ 隐藏面板' : '🎛️ 控制面板';
      document.getElementById('expand-sidebar-btn').classList.toggle('hidden', STATE.uiVisible);
    }

    function bindEvents() {
      syncUIVisibility();
      let resizeFrame = 0;
      window.addEventListener('resize', () => {
        if (resizeFrame) return;
        resizeFrame = requestAnimationFrame(() => {
          resizeFrame = 0;
          const w = window.innerWidth, h = window.innerHeight;
          const dpr = scenePixelRatio();
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          if (renderer.getPixelRatio() !== dpr) {
            renderer.setPixelRatio(dpr);
            composer.setPixelRatio(dpr);
          }
          renderer.setSize(w, h);
          composer.setSize(w, h);
          resizeOverlayCanvases();
        });
      });

      const toggleUI = () => { STATE.uiVisible = !STATE.uiVisible; syncUIVisibility(); };
      document.getElementById('toggle-ui-btn').onclick = toggleUI;
      document.getElementById('collapse-sidebar-btn').onclick = toggleUI;
      document.getElementById('expand-sidebar-btn').onclick = toggleUI;

      document.querySelectorAll('.section-card .section-title').forEach(t => {
        t.onclick = () => t.closest('.section-card').classList.toggle('collapsed');
      });

      document.getElementById('fs-btn').onclick = () => {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
        else document.exitFullscreen?.();
      };

      document.getElementById('mode-tree-btn').onclick = () => setMode('TREE');
      document.getElementById('mode-scatter-btn').onclick = () => setMode('SCATTER');
      document.getElementById('grab-photo-btn').onclick = triggerPhotoGrab;
      document.getElementById('open-album-btn').onclick = () => openAlbum('grid', 0);
      document.getElementById('dock-album-btn').onclick = () => openAlbum('grid', 0);

      document.getElementById('auto-rotate-btn').onclick = e => {
        STATE.autoRotate = !STATE.autoRotate;
        e.currentTarget.classList.toggle('active', STATE.autoRotate);
      };
      document.getElementById('toggle-fireworks-btn').onclick = e => {
        STATE.fireworksEnabled = !STATE.fireworksEnabled;
        e.currentTarget.classList.toggle('active', STATE.fireworksEnabled);
      };
      document.getElementById('replay-intro-btn').onclick = startIntroSequence;
      document.getElementById('skip-intro-btn').onclick = finishIntroSequence;

      document.getElementById('slider-rotspeed').oninput = e => {
        CONFIG.interaction.rotationSpeed = parseFloat(e.target.value);
        document.getElementById('rot-speed-val').textContent = `${CONFIG.interaction.rotationSpeed.toFixed(1)}x`;
      };

      document.querySelectorAll('.dir-btn[data-dir]').forEach(btn => {
        const d = btn.dataset.dir;
        const start = () => { manualDirY = d === 'left' ? -1 : 1; };
        const stop = () => { manualDirY = 0; };
        btn.addEventListener('pointerdown', start);
        btn.addEventListener('pointerup', stop);
        btn.addEventListener('pointerleave', stop);
        btn.addEventListener('pointercancel', stop);
      });
      document.getElementById('reset-view-btn').onclick = () => {
        STATE.rotY = 0; STATE.velY = 0; STATE.targetZoom = CONFIG.camera.z; setMode('TREE');
      };

      ['input-line1', 'input-line2', 'input-blessing', 'slider-fontsize', 'color-picker'].forEach(id => {
        document.getElementById(id).addEventListener('input', () => saveAndApplyText(false));
      });
      const showGreeting = document.getElementById('show-greeting');
      showGreeting.onchange = () => saveAndApplyText(true);
      document.getElementById('replay-writing-btn').onclick = () => {
        showGreeting.checked = true;
        saveAndApplyText(true);
      };

      document.getElementById('play-btn').onclick = toggleMusicPlay;
      document.getElementById('music-quick-btn').onclick = toggleMusicPlay;
      document.getElementById('replay-btn').onclick = replayMusic;
      document.getElementById('slider-volume').oninput = e => {
        const v = parseInt(e.target.value, 10);
        document.getElementById('volume-val').textContent = `${v}%`;
        bgmAudio.volume = v / 100;
        if (masterGain) masterGain.gain.value = (v / 100) * 0.45;
      };

      document.getElementById('slider-snow-count').oninput = e => {
        CONFIG.snow.count = parseInt(e.target.value, 10);
        document.getElementById('snow-count-val').textContent = CONFIG.snow.count;
        createSnow();
      };
      document.getElementById('slider-snow-speed').oninput = e => {
        CONFIG.snow.speed = parseFloat(e.target.value);
        document.getElementById('snow-speed-val').textContent = CONFIG.snow.speed.toFixed(1);
      };

      document.getElementById('file-input').addEventListener('change', e => { handlePhotoFiles(e.target.files); e.target.value = ''; });
      document.getElementById('album-file-input').addEventListener('change', e => { handlePhotoFiles(e.target.files); e.target.value = ''; });

      document.getElementById('music-input').addEventListener('change', e => {
        const f = e.target.files?.[0];
        if (!f) return;
        stopMusicBox();
        saveMusicToDB(f);
        bgmAudio.src = URL.createObjectURL(f);
        hasCustomMusic = true;
        document.getElementById('music-source-tag').textContent = f.name.slice(0, 12);
        isMusicPlaying = false;
        updatePlayBtnUI(false);
        startBackgroundMusic();
        e.target.value = '';
      });

      document.getElementById('toggle-cam-btn').onclick = () => {
        STATE.cameraVisible = !STATE.cameraVisible;
        document.getElementById('webcam-wrapper').classList.toggle('camera-hidden', !STATE.cameraVisible);
        document.getElementById('toggle-cam-btn').textContent = STATE.cameraVisible ? '📷 隐藏画面' : '📷 显示画面';
      };
      document.getElementById('cam-enable').onclick = startGesture;

      // 3D 单图聚焦导航
      document.getElementById('focus-prev-btn').onclick = () => stepFocusPhoto(-1);
      document.getElementById('focus-next-btn').onclick = () => stepFocusPhoto(1);
      document.getElementById('focus-close-btn').onclick = () => setMode('SCATTER');

      // INS 圣诞精装 3D 翻页手账交互（封面切换、左右滑翻页、卡点自动翻页、存图发朋友圈、灯箱）
      document.getElementById('album-close-btn').onclick = closeAlbum;
      document.getElementById('paper-toggle-cover-btn').onclick = togglePaperCover;
      document.getElementById('paper-prev-btn').onclick = () => stepPaperSpread(-1);
      document.getElementById('paper-next-btn').onclick = () => stepPaperSpread(1);
      document.getElementById('paper-export-btn').onclick = exportCurrentSpreadPoster;
      document.getElementById('paper-autoplay-btn').onclick = () => {
        ALBUM.playing = !ALBUM.playing;
        if (ALBUM.playing && ALBUM.isCover) { ALBUM.isCover = false; ALBUM.spreadIndex = 0; renderPaperAlbum(); }
        ALBUM.lastSlideAt = performance.now();
        updatePaperAutoBtn();
      };
      document.getElementById('paper-album-title').oninput = e => {
        try { localStorage.setItem(PAPER_TITLE_KEY, e.currentTarget.textContent.trim()); } catch {}
      };
      document.getElementById('paper-cover-input').onchange = e => {
        const f = e.target.files?.[0];
        if (!f) return;
        const fr = new FileReader();
        fr.onload = ev => {
          try { localStorage.setItem(PAPER_COVER_KEY, ev.target.result); } catch {}
          ALBUM.isCover = true;
          renderPaperAlbum();
        };
        fr.readAsDataURL(f);
        e.target.value = '';
      };
      document.getElementById('lightbox-close-btn').onclick = closeLightbox;
      document.getElementById('fan-lightbox').onclick = e => { if (e.target.id === 'fan-lightbox') closeLightbox(); };

      bindPaperSwipe(document.getElementById('paper-stage'));
      const clearUploadedPhotos = () => {
        if (!confirm('确定清空所有已上传照片吗？')) return;
        clearPhotosDB();
        photoRecords.forEach(r => photoMeshGroup.remove(r.group));
        photoRecords = [];
        createDefaultPhotos();
        refreshAlbumIfOpen();
      };
      document.getElementById('album-clear-btn').onclick = clearUploadedPhotos;
      document.getElementById('mobile-clear-photos-btn').onclick = clearUploadedPhotos;

      // 键盘快捷键（严禁 ArrowUp/ArrowDown）
      window.addEventListener('keydown', e => {
        if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName) || e.target.isContentEditable) return;
        const k = e.key.toLowerCase();
        if (e.key === 'Escape') {
          if (ALBUM.open) closeAlbum();
          else if (STATE.mode === 'FOCUS') setMode('SCATTER');
        }
        if (k === 'h') toggleUI();
        if (e.code === 'Space') { e.preventDefault(); setMode('TREE'); }
        if (k === 'z') setMode('SCATTER');
        if (k === 'x') triggerPhotoGrab();
        if (e.code === 'ArrowLeft') {
          if (ALBUM.open) stepPaperSpread(-1);
          else if (STATE.mode === 'FOCUS') stepFocusPhoto(-1);
          else manualDirY = -1;
        }
        if (e.code === 'ArrowRight') {
          if (ALBUM.open) stepPaperSpread(1);
          else if (STATE.mode === 'FOCUS') stepFocusPhoto(1);
          else manualDirY = 1;
        }
      });
      window.addEventListener('keyup', e => {
        if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') manualDirY = 0;
      });
    }

    /* ==================== 启动入口 ==================== */
    async function bootstrap() {
      initThree();
      setupCanvasInteraction();
      bindEvents();
      loadTextConfig();
      const dbReady = initDB();
      prepareBackgroundMusic(dbReady);
      animate();

      // 等待霞鹜文楷与花体字加载（最多等 1.5s，不阻塞开场）
      if (document.fonts) {
        await Promise.race([
          Promise.all([
            document.fonts.load('400 32px "LXGW WenKai"').catch(() => {}),
            document.fonts.load('400 48px "Great Vibes"').catch(() => {})
          ]),
          new Promise(r => setTimeout(r, 1500))
        ]);
      }

      const loader = document.getElementById('loader');
      if (loader) { loader.style.opacity = '0'; setTimeout(() => loader.remove(), 420); }

      startIntroSequence();

      await dbReady;
      const savedPhotos = await loadPhotosFromDB();
      if (savedPhotos.length > 0) savedPhotos.forEach(p => addPhotoFromDataUrl(p.data, p.id));
      else createDefaultPhotos();
    }

    bootstrap().catch(err => {
      console.error('Init failed:', err);
      const loader = document.getElementById('loader');
      if (loader) loader.remove();
    });
  </script>
</body>
</html>
