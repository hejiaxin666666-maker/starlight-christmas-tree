<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>星钻圣诞树 v2 · Diamond Starlight Christmas Tree</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Great+Vibes&family=Noto+Serif+SC:wght@300;400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" rel="stylesheet">
  <style>
    :root {
      --glass-bg: rgba(10, 10, 18, 0.72);
      --glass-strong: rgba(8, 8, 15, 0.88);
      --glass-border: rgba(215, 226, 245, 0.18);
      --glass-hi: rgba(255, 255, 255, 0.10);
      --accent: #dce8fb;
      --accent-warm: #f3d7b6;
      --text-main: #f4f6fb;
      --text-sub: #9ea6bc;
      --panel-width: 254px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #030106;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      user-select: none;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      z-index: 1;
      touch-action: none;
      cursor: grab;
    }
    #canvas-container:active { cursor: grabbing; }

    #text-particle-canvas {
      position: fixed;
      inset: 0;
      z-index: 14;
      pointer-events: none;
    }
    #intro-canvas {
      position: fixed;
      inset: 0;
      z-index: 60;
      pointer-events: none;
    }

    /* Loader */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #030106;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: opacity 0.45s ease;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1.5px solid rgba(220, 232, 251, 0.16);
      border-top-color: #ffffff;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-text {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 4px;
      color: var(--accent);
      opacity: 0.85;
    }

    /* Glass & Pills */
    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(22px) saturate(150%);
      -webkit-backdrop-filter: blur(22px) saturate(150%);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      box-shadow: 0 18px 46px rgba(0, 0, 0, 0.55), inset 0 1px 0 var(--glass-hi);
    }

    .top-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 12px;
      color: var(--accent);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .top-pill:hover {
      background: rgba(220, 232, 251, 0.14);
      border-color: rgba(255, 255, 255, 0.45);
      color: #fff;
    }
    .top-pill:active { transform: scale(0.97); }

    #skip-intro-btn {
      position: fixed;
      bottom: calc(20px + var(--safe-bottom));
      right: 20px;
      z-index: 65;
      display: none;
    }

    #expand-sidebar-btn {
      position: fixed;
      top: calc(14px + var(--safe-top));
      left: 14px;
      z-index: 42;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    #expand-sidebar-btn.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-16px);
    }

    #top-right-controls {
      position: fixed;
      top: calc(14px + var(--safe-top));
      right: 14px;
      z-index: 40;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end;
    }

    /* Left Sidebar */
    #left-sidebar {
      position: fixed;
      top: calc(14px + var(--safe-top));
      left: 14px;
      bottom: calc(14px + var(--safe-bottom));
      width: var(--panel-width);
      z-index: 35;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease;
    }
    #left-sidebar.panel-hidden {
      transform: translateX(calc(-100% - 32px));
      opacity: 0;
      pointer-events: none !important;
    }

    .sidebar-scroll {
      flex: 1;
      overflow-y: auto;
      pointer-events: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scrollbar-width: thin;
      scrollbar-color: rgba(220, 232, 251, 0.28) transparent;
    }
    .sidebar-scroll::-webkit-scrollbar { width: 4px; }
    .sidebar-scroll::-webkit-scrollbar-thumb {
      background: rgba(220, 232, 251, 0.28);
      border-radius: 4px;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 2px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .sidebar-brand {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--accent);
    }
    .collapse-btn {
      padding: 4px 9px;
      border-radius: 999px;
      border: 1px solid rgba(220, 232, 251, 0.28);
      background: rgba(220, 232, 251, 0.08);
      color: var(--accent);
      font-size: 11px;
      cursor: pointer;
    }
    .collapse-btn:hover { background: rgba(220, 232, 251, 0.22); color: #fff; }

    .section-card {
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .section-card:last-child { border-bottom: none; padding-bottom: 2px; }
    .section-title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      padding: 2px 0;
    }
    .section-chevron {
      font-size: 10px;
      color: var(--text-sub);
      transition: transform 0.2s ease;
    }
    .section-card.collapsed .section-chevron { transform: rotate(-90deg); }
    .section-body { display: flex; flex-direction: column; gap: 7px; }
    .section-card.collapsed .section-body { display: none; }
    .section-sub {
      font-size: 11px;
      color: var(--text-sub);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .btn-row-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }

    .elegant-btn {
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-height: 30px;
      padding: 5px 8px;
      border-radius: 8px;
      border: 1px solid rgba(220, 232, 251, 0.24);
      background: rgba(255, 255, 255, 0.035);
      color: var(--accent);
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .elegant-btn:hover {
      background: rgba(220, 232, 251, 0.14);
      border-color: rgba(255, 255, 255, 0.55);
      color: #fff;
    }
    .elegant-btn.active {
      background: linear-gradient(135deg, rgba(220, 232, 251, 0.26), rgba(180, 208, 248, 0.10));
      border-color: #ffffff;
      color: #fff;
    }
    .elegant-btn.highlight-btn {
      background: linear-gradient(135deg, rgba(243, 215, 182, 0.22), rgba(215, 160, 195, 0.16));
      border-color: rgba(243, 215, 182, 0.55);
      color: #fff5e8;
    }
    .elegant-btn.highlight-btn:hover {
      background: linear-gradient(135deg, rgba(243, 215, 182, 0.36), rgba(215, 160, 195, 0.28));
    }
    .elegant-btn.btn-danger {
      border-color: rgba(230, 110, 110, 0.45);
      color: #f3a4a4;
    }
    .elegant-btn input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .input-glass, .textarea-glass {
      width: 100%;
      padding: 5px 8px;
      border-radius: 7px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(0, 0, 0, 0.36);
      color: #f6f8ff;
      font-size: 11.5px;
      font-family: inherit;
      outline: none;
    }
    .input-glass { height: 28px; }
    .textarea-glass { min-height: 78px; line-height: 1.5; resize: vertical; }
    .input-glass:focus, .textarea-glass:focus { border-color: var(--accent); }
    select.input-glass option { background: #0e101c; color: #f6f8ff; }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      outline: none;
      margin: 4px 0;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ffffff;
      border: 1.5px solid #161822;
      box-shadow: 0 0 8px rgba(210, 228, 255, 0.8);
      cursor: pointer;
    }
    input[type="color"] {
      -webkit-appearance: none;
      width: 30px;
      height: 24px;
      border: 1px solid var(--glass-border);
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
      padding: 0;
    }

    .dir-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 5px;
    }
    .dir-btn {
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 7px;
      border: 1px solid rgba(220, 232, 251, 0.22);
      background: rgba(255, 255, 255, 0.03);
      color: var(--accent);
      font-size: 11px;
      cursor: pointer;
    }
    .dir-btn:hover { background: rgba(220, 232, 251, 0.16); color: #fff; }
    .dir-btn:active { background: var(--accent); color: #090b12; }

    .resource-dock {
      pointer-events: auto;
      padding: 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    /* Focus Photo Navigation Overlay */
    #focus-nav {
      position: fixed;
      bottom: calc(56px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 32;
      display: none;
      align-items: center;
      gap: 10px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(18px);
    }
    #focus-nav.show { display: inline-flex; }

    /* Webcam PiP */
    #webcam-wrapper {
      position: fixed;
      bottom: calc(16px + var(--safe-bottom));
      right: 16px;
      width: 164px;
      height: 122px;
      border-radius: 12px;
      border: 1px solid rgba(220, 232, 251, 0.34);
      background: rgba(5, 6, 12, 0.85);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7);
      overflow: hidden;
      z-index: 28;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    #webcam-wrapper.camera-hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(14px) scale(0.96);
    }
    #webcam-canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      display: block;
    }
    #cam-enable {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 31;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(220, 232, 251, 0.55);
      background: rgba(8, 10, 18, 0.86);
      color: #fff;
      font-size: 11px;
      white-space: nowrap;
      cursor: pointer;
    }
    #cam-enable:hover { background: var(--accent); color: #090b12; }
    #cam-status {
      position: absolute;
      bottom: 7px;
      right: 7px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #662222;
      z-index: 32;
    }
    #cam-status.active { background: #3be374; box-shadow: 0 0 8px #3be374; }
    #cam-gesture-badge {
      position: absolute;
      top: 6px;
      left: 6px;
      z-index: 32;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(8, 10, 18, 0.76);
      border: 1px solid rgba(220, 232, 251, 0.35);
      color: #fff;
      font-size: 10px;
      display: none;
    }

    /* Bottom Status Hint */
    #gesture-hint {
      position: fixed;
      bottom: calc(12px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      max-width: min(92vw, 580px);
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(8, 8, 16, 0.62);
      border: 1px solid rgba(220, 232, 251, 0.16);
      backdrop-filter: blur(12px);
      color: rgba(235, 240, 252, 0.88);
      font-size: 11px;
      text-align: center;
      pointer-events: none;
      z-index: 22;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 单指指向微光准星 */
    #finger-cursor {
      position: fixed;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 55;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,224,165,0.65) 45%, rgba(255,200,150,0) 75%);
      box-shadow: 0 0 18px rgba(255, 226, 168, 0.85);
      display: none;
    }

    /* ==================== INS 圣诞精装 3D 翻页手账相册（Paper 风格） ==================== */
    #album-modal {
      position: fixed;
      inset: 0;
      z-index: 80;
      background:
        radial-gradient(circle at 22% 18%, rgba(168, 46, 58, 0.22), transparent 44%),
        radial-gradient(circle at 80% 78%, rgba(217, 180, 106, 0.16), transparent 46%),
        radial-gradient(ellipse at 50% 46%, rgba(26, 46, 38, 0.90), rgba(11, 20, 17, 0.95));
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: calc(16px + var(--safe-top)) 18px calc(20px + var(--safe-bottom));
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.42s cubic-bezier(0.22, 1, 0.36, 1);
      overflow: hidden;
      user-select: none;
    }
    #album-modal.open { opacity: 1; pointer-events: auto; }

    /* 顶部极简 Paper 栏：左右圆形图标 + 居中可编辑标题与页数 */
    .paper-topbar {
      width: 100%;
      max-width: 1040px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 86;
    }
    .paper-top-group {
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .paper-circle-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(242, 216, 163, 0.32);
      background: rgba(250, 244, 234, 0.10);
      color: #faf4ea;
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: transform 0.22s ease, background 0.22s ease, border-color 0.22s ease;
    }
    .paper-circle-btn:hover {
      background: rgba(250, 244, 234, 0.22);
      border-color: rgba(242, 216, 163, 0.72);
      transform: translateY(-1px);
    }
    .paper-circle-btn.active {
      background: #8f222d;
      border-color: #f2d8a3;
      color: #fff8ee;
    }
    .paper-header-center {
      text-align: center;
      flex: 1;
      min-width: 0;
    }
    #paper-album-title {
      margin: 0;
      font-family: 'LXGW WenKai', 'Noto Serif SC', serif;
      font-size: clamp(18px, 2.4vw, 22px);
      font-weight: 500;
      letter-spacing: 3px;
      color: #faf4ea;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.45);
      cursor: text;
      outline: none;
      display: inline-block;
      padding: 2px 10px;
      border-radius: 8px;
      transition: background 0.2s ease;
    }
    #paper-album-title:hover, #paper-album-title:focus {
      background: rgba(250, 244, 234, 0.10);
    }
    .paper-subtitle {
      margin-top: 3px;
      font-size: 11.5px;
      letter-spacing: 1.5px;
      color: rgba(242, 216, 163, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* 中央 3D 手账本舞台（合上封面 / 展开 3D 景深层叠跨页） */
    .paper-stage {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      perspective: 1800px;
      touch-action: pan-y;
      min-height: 0;
    }

    /* 1. 合上状态：放大版 INS 圣诞树精装手账本封面（高定绘画贴图 + 支持自定义换封面） */
    .paper-cover-wrap {
      position: relative;
      width: clamp(300px, 33vw, 420px);
      height: clamp(420px, 68vh, 595px);
      border-radius: 8px 24px 24px 8px;
      background: linear-gradient(155deg, #16372b 0%, #0d231b 65%, #091813 100%);
      box-shadow:
        0 38px 80px rgba(0, 0, 0, 0.68),
        0 12px 28px rgba(0, 0, 0, 0.42),
        inset 0 1px 0 rgba(255, 244, 222, 0.28);
      cursor: pointer;
      display: flex;
      overflow: hidden;
      transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.4s ease;
      animation: coverPop 0.52s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes coverPop {
      0% { opacity: 0; transform: scale(0.86) rotateY(-14deg); }
      100% { opacity: 1; transform: scale(1) rotateY(0deg); }
    }
    .paper-cover-wrap:hover {
      transform: translateY(-6px) rotateY(-5deg) scale(1.02);
      box-shadow: 0 46px 92px rgba(0, 0, 0, 0.76), 0 0 42px rgba(217, 180, 106, 0.28);
    }
    .paper-cover-spine {
      width: 34px;
      flex-shrink: 0;
      background: linear-gradient(90deg, #63151e 0%, #982431 52%, #701923 100%);
      border-right: 1.5px solid rgba(242, 216, 163, 0.60);
      box-shadow: inset -5px 0 12px rgba(0, 0, 0, 0.42);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 22px 0;
    }
    .paper-cover-spine::after {
      content: '';
      position: absolute;
      right: 5px;
      top: 14px;
      bottom: 14px;
      width: 1px;
      background: rgba(242, 216, 163, 0.42);
    }
    .spine-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #f2d8a3;
      opacity: 0.9;
    }
    .paper-cover-face {
      flex: 1;
      position: relative;
      padding: 22px 20px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
    }
    .paper-cover-art {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      z-index: 0;
    }
    .paper-cover-vignette {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(10, 22, 17, 0.42) 0%, rgba(10, 22, 17, 0.04) 28%, rgba(10, 22, 17, 0.08) 64%, rgba(8, 18, 14, 0.72) 100%);
      pointer-events: none;
      z-index: 1;
    }
    .paper-cover-frame {
      position: absolute;
      inset: 13px;
      border: 1px solid rgba(246, 225, 184, 0.55);
      border-radius: 4px 16px 16px 4px;
      pointer-events: none;
      z-index: 2;
    }
    .paper-cover-badge {
      font-family: 'Cinzel', serif;
      font-size: 10.5px;
      letter-spacing: 3.5px;
      color: #f8e6c2;
      padding: 4px 14px;
      border: 1px solid rgba(246, 225, 184, 0.52);
      border-radius: 999px;
      background: rgba(143, 34, 45, 0.62);
      backdrop-filter: blur(6px);
      z-index: 3;
    }
    .paper-cover-titles {
      text-align: center;
      z-index: 3;
    }
    .paper-cover-en {
      font-family: 'Great Vibes', 'Cinzel', cursive;
      font-size: clamp(32px, 3.6vw, 44px);
      color: #fae6be;
      line-height: 1.05;
      text-shadow: 0 3px 16px rgba(0, 0, 0, 0.65), 0 0 18px rgba(242, 216, 163, 0.35);
    }
    .paper-cover-cn {
      margin-top: 4px;
      font-family: 'LXGW WenKai', 'Noto Serif SC', serif;
      font-size: 15px;
      letter-spacing: 4px;
      color: rgba(255, 250, 242, 0.95);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
    }
    .paper-cover-cta {
      margin-top: 8px;
      font-size: 10.5px;
      letter-spacing: 2.5px;
      color: rgba(246, 225, 184, 0.88);
    }

    /* 2. 展开状态：放大版 Paper 3D 景深层叠双页手账本 */
    .paper-book-deck {
      position: relative;
      width: min(94vw, 1080px);
      height: min(70vh, 590px);
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 2000px;
    }
    .paper-spread {
      position: absolute;
      width: min(86vw, 900px);
      height: min(66vh, 550px);
      border-radius: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
      background: #faf4ea;
      box-shadow: 0 26px 62px rgba(0, 0, 0, 0.56), 0 0 0 1px rgba(242, 216, 163, 0.28);
      transform-style: preserve-3d;
      transition: transform 0.56s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.42s ease,
                  filter 0.42s ease,
                  box-shadow 0.42s ease;
      cursor: pointer;
    }
    .paper-spread.active {
      cursor: default;
      box-shadow: 0 34px 78px rgba(0, 0, 0, 0.68), 0 0 0 1.5px rgba(242, 216, 163, 0.48);
    }
    /* 中缝真实装订折痕阴影 */
    .paper-spread::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 44px;
      transform: translateX(-50%);
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(38, 22, 16, 0.08) 32%,
        rgba(24, 14, 10, 0.22) 50%,
        rgba(38, 22, 16, 0.08) 68%,
        transparent 100%);
      pointer-events: none;
      z-index: 8;
    }
    .paper-spread.first-edge { border-left: 5px solid #8f222d; }
    .paper-spread.last-edge { border-right: 5px solid #d9b46a; }

    .paper-spread.flip-next { animation: spreadFlipNext 0.52s cubic-bezier(0.22, 1, 0.36, 1); }
    .paper-spread.flip-prev { animation: spreadFlipPrev 0.52s cubic-bezier(0.22, 1, 0.36, 1); }
    .paper-spread.turning { overflow: visible; }
    .paper-spread.turning .p-page { border-radius: inherit; }
    .paper-turn-reveal, .paper-turn-sheet {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50%;
      pointer-events: none;
    }
    .paper-turn-reveal { z-index: 7; overflow: hidden; }
    .paper-turn-sheet { z-index: 9; transform-style: preserve-3d; will-change: transform; }
    .paper-turn-sheet > .p-page {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      box-shadow: inset 0 0 28px rgba(37, 20, 12, 0.22);
    }
    .paper-turn-sheet > .p-page:nth-child(2) { transform: rotateY(180deg); }
    .paper-turn-next { left: 50%; transform-origin: left center; }
    .paper-turn-prev { left: 0; transform-origin: right center; }
    @keyframes spreadFlipNext {
      0% { transform: translateX(48px) rotateY(-18deg) scale(0.96); }
      100% { transform: translateX(0) rotateY(0deg) scale(1); }
    }
    @keyframes spreadFlipPrev {
      0% { transform: translateX(-48px) rotateY(18deg) scale(0.96); }
      100% { transform: translateX(0) rotateY(0deg) scale(1); }
    }

    /* 单页内页基础样式与 INS 圣诞手账元素 */
    .p-page {
      position: relative;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      color: #2b2623;
    }
    .p-page.cream {
      background:
        radial-gradient(circle at 85% 15%, rgba(217, 180, 106, 0.14), transparent 48%),
        linear-gradient(160deg, #fcf8f0 0%, #f5ecdc 100%);
    }
    .p-page.sage {
      background:
        radial-gradient(circle at 18% 82%, rgba(29, 66, 52, 0.12), transparent 52%),
        linear-gradient(155deg, #eef3ec 0%, #e1eadf 100%);
    }
    .p-page.burgundy {
      background:
        radial-gradient(circle at 25% 20%, rgba(242, 216, 163, 0.16), transparent 50%),
        linear-gradient(155deg, #7d1d27 0%, #58121a 100%);
      color: #faf4ea;
    }
    .p-page.pine {
      background:
        radial-gradient(circle at 80% 20%, rgba(242, 216, 163, 0.14), transparent 50%),
        linear-gradient(155deg, #1b3e31 0%, #122a21 100%);
      color: #faf4ea;
    }
    .p-page.full-bleed {
      padding: 0;
      background: #101916;
    }
    .p-page.padded {
      padding: 20px 22px 18px;
      justify-content: space-between;
    }

    .p-full-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      cursor: zoom-in;
      transition: transform 0.55s ease;
    }
    .p-full-img:hover { transform: scale(1.03); }

    .p-washi {
      position: absolute;
      width: 74px;
      height: 18px;
      top: -8px;
      left: 50%;
      transform: translateX(-50%) rotate(-3deg);
      background: repeating-linear-gradient(45deg, rgba(143, 34, 45, 0.78) 0 6px, rgba(242, 216, 163, 0.78) 6px 10px);
      opacity: 0.92;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.14);
      pointer-events: none;
      z-index: 4;
    }
    .p-washi.pine-tape {
      background: repeating-linear-gradient(-45deg, rgba(29, 66, 52, 0.78) 0 7px, rgba(250, 244, 234, 0.78) 7px 11px);
      transform: translateX(-50%) rotate(3deg);
    }
    .p-polaroid {
      position: relative;
      background: #fffdf9;
      padding: 8px 8px 24px;
      border-radius: 5px;
      box-shadow: 0 10px 24px rgba(34, 22, 14, 0.18), 0 0 0 1px rgba(185, 131, 82, 0.16);
      transform: rotate(var(--tilt, -2deg));
      transition: transform 0.3s ease;
      cursor: zoom-in;
    }
    .p-polaroid:hover { transform: rotate(0deg) scale(1.03); z-index: 5; }
    .p-polaroid img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 2px;
      display: block;
    }
    .p-polaroid-cap {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 5px;
      display: flex;
      justify-content: space-between;
      font-family: 'Cinzel', serif;
      font-size: 9px;
      letter-spacing: 1px;
      color: #8f222d;
    }
    .p-arch-photo {
      position: relative;
      border-radius: 999px 999px 10px 10px;
      overflow: hidden;
      border: 3px solid #fffdf9;
      box-shadow: 0 10px 24px rgba(34, 22, 14, 0.18);
      cursor: zoom-in;
    }
    .p-arch-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .p-stamp {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 999px;
      font-family: 'Cinzel', serif;
      font-size: 9.5px;
      letter-spacing: 1.5px;
      border: 1px solid rgba(143, 34, 45, 0.35);
      color: #8f222d;
      background: rgba(143, 34, 45, 0.08);
    }
    .p-page.burgundy .p-stamp, .p-page.pine .p-stamp {
      border-color: rgba(242, 216, 163, 0.45);
      color: #f6e1b8;
      background: rgba(242, 216, 163, 0.12);
    }
    .p-float-badge {
      position: absolute;
      left: 14px;
      bottom: 14px;
      right: 14px;
      padding: 9px 13px;
      border-radius: 12px;
      background: rgba(18, 32, 26, 0.56);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(242, 216, 163, 0.38);
      color: #faf4ea;
      font-family: 'LXGW WenKai', 'Noto Serif SC', serif;
      font-size: 12px;
      letter-spacing: 1px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }
    .p-heading-en {
      font-family: 'Great Vibes', 'Cinzel', cursive;
      font-size: clamp(24px, 2.6vw, 31px);
      color: #8f222d;
      line-height: 1.05;
    }
    .p-page.burgundy .p-heading-en, .p-page.pine .p-heading-en { color: #f4dca8; }
    .p-heading-serif {
      font-family: 'Cinzel', 'Noto Serif SC', serif;
      font-size: 14px;
      letter-spacing: 2.5px;
      color: #1d4234;
      font-weight: 600;
    }
    .p-page.burgundy .p-heading-serif, .p-page.pine .p-heading-serif { color: #f6e1b8; }

    .p-diary-note {
      font-family: 'LXGW WenKai', 'KaiTi', 'Noto Serif SC', serif;
      font-size: 12.5px;
      line-height: 1.72;
      letter-spacing: 0.8px;
      color: #463c35;
      padding: 6px 8px;
      border-radius: 8px;
      outline: none;
      cursor: text;
      background: rgba(255, 255, 255, 0.35);
      border: 1px dashed transparent;
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    .p-diary-note:hover, .p-diary-note:focus {
      border-color: rgba(143, 34, 45, 0.38);
      background: rgba(255, 255, 255, 0.72);
    }
    .p-page.burgundy .p-diary-note, .p-page.pine .p-diary-note {
      color: rgba(250, 244, 234, 0.92);
      background: rgba(255, 255, 255, 0.08);
    }
    .p-page.burgundy .p-diary-note:hover, .p-page.burgundy .p-diary-note:focus,
    .p-page.pine .p-diary-note:hover, .p-page.pine .p-diary-note:focus {
      border-color: rgba(242, 216, 163, 0.55);
      background: rgba(255, 255, 255, 0.14);
    }
    .p-footer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      letter-spacing: 1.2px;
      color: rgba(70, 60, 53, 0.65);
      font-family: 'Cinzel', serif;
    }
    .p-page.burgundy .p-footer-row, .p-page.pine .p-footer-row { color: rgba(242, 216, 163, 0.72); }

    .p-photo-del {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.72);
      background: rgba(143, 34, 45, 0.88);
      color: #fff;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s ease;
      z-index: 6;
    }
    .p-photo-box:hover .p-photo-del { opacity: 1; }

    /* 底部 Paper 风格 4 枚白色圆形主按钮栏 */
    .paper-bottombar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 86;
      padding-top: 8px;
    }
    .paper-dock-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255, 248, 236, 0.65);
      background: #faf4ea;
      color: #1d4234;
      font-size: 17px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.36);
      transition: transform 0.22s ease, background 0.22s ease, color 0.22s ease;
    }
    .paper-dock-btn:hover {
      transform: translateY(-3px) scale(1.06);
      background: #fffdf8;
      color: #8f222d;
    }
    .paper-dock-btn.primary {
      background: #8f222d;
      color: #fff8ee;
      border-color: #f2d8a3;
    }
    .paper-dock-btn.primary:hover { background: #a82e3a; color: #fff; }
    .paper-dock-btn[data-tip]::after {
      content: attr(data-tip);
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%) translateY(4px);
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(15, 26, 22, 0.90);
      border: 1px solid rgba(242, 216, 163, 0.35);
      color: #faf4ea;
      font-size: 11px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .paper-dock-btn:hover::after { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* 单张照片放大灯箱（点右上角 × 回到手账相册） */
    #fan-lightbox {
      position: fixed;
      inset: 0;
      z-index: 95;
      background: rgba(8, 14, 12, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    #fan-lightbox.open { display: flex; }
    .lightbox-card {
      position: relative;
      max-width: min(88vw, 760px);
      max-height: 82vh;
      padding: 12px;
      border-radius: 16px;
      background: #faf4ea;
      border: 2px solid #d9b46a;
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.78);
    }
    .lightbox-card img {
      display: block;
      max-width: min(82vw, 720px);
      max-height: 74vh;
      border-radius: 10px;
      object-fit: contain;
    }
    #lightbox-close-btn {
      position: absolute;
      top: -14px;
      right: -14px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1.5px solid #f2d8a3;
      background: #8f222d;
      color: #fff;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.55);
    }
    #lightbox-close-btn:hover { background: #a82e3a; }

    @media (max-width: 768px) {
      :root { --panel-width: min(84vw, 296px); }
      #expand-sidebar-btn { display: none; }
      #top-right-controls { flex-direction: row; }
      #webcam-wrapper {
        width: 116px;
        height: 88px;
        bottom: calc(48px + var(--safe-bottom));
        right: 10px;
      }
      #gesture-hint { font-size: 10px; padding: 5px 10px; }
      .paper-topbar { position: relative; }
      .paper-header-center { padding-inline: 50px; pointer-events: none; }
      .paper-top-group { position: absolute; right: 0; }
      #album-close-btn { width: 44px; height: 44px; }
      .paper-top-group:first-child, .paper-top-group label, #album-clear-btn,
      .paper-bottombar, .p-photo-del { display: none; }
      #mobile-clear-photos-btn { display: inline-flex; }
      .paper-spread { width: 92vw; height: min(56vh, 360px); border-radius: 14px; }
      .p-page.padded { padding: 12px 12px 10px; }
      .p-diary-note { font-size: 11px; line-height: 1.55; pointer-events: none; }
      .p-heading-en { font-size: 20px; }
    }
    @media (min-width: 769px) { #mobile-clear-photos-btn { display: none; } }
    @media (prefers-reduced-motion: reduce) {
      .paper-spread.flip-next, .paper-spread.flip-prev { animation: none; }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<body>
  <div id="loader">
    <div class="spinner"></div>
    <div class="loader-text">STARLIGHT CHRISTMAS</div>
  </div>

  <div id="canvas-container"></div>
  <canvas id="text-particle-canvas"></canvas>
  <canvas id="intro-canvas"></canvas>

  <div id="top-right-controls">

  <aside id="left-sidebar">
    <div class="sidebar-scroll glass-panel">
      <div class="sidebar-header">
        <span class="sidebar-brand">❄️ 星钻控制台</span>
        <button class="collapse-btn" id="collapse-sidebar-btn" type="button">◀ 收起</button>
      </div>

      <!-- 1. 形态与相册集 -->
      <div class="section-card">
        <div class="section-title">
          <span>✨ 形态与相册</span>
          <span class="section-chevron">▾</span>
        </div>
        <div class="section-body">
          <div class="btn-row">
            <button class="elegant-btn active" id="mode-tree-btn" type="button">🎄 聚拢 (Space)</button>
            <button class="elegant-btn" id="mode-scatter-btn" type="button">🌌 散开 (Z)</button>
          </div>
          <div class="btn-row">
            <button class="elegant-btn" id="grab-photo-btn" type="button">🖼️ 抓取照片 (X)</button>
            <button class="elegant-btn highlight-btn" id="open-album-btn" type="button">🎞️ 相册集</button>

            <div class="dir-btn" data-dir="right" title="向右旋转">右转 ▶</div>

          <input type="text" id="input-line2" class="input-glass" placeholder="副标题" value="愿你被温柔的时光照亮 · 2026">
          <textarea id="input-blessing" class="textarea-glass" placeholder="每行一句，自动转为星尘点阵楷体逐字书写">亲爱的你

2026.12.25</textarea>

          <button class="elegant-btn" id="replay-writing-btn" type="button">✨ 重新播放点阵书写</button>
        </div>
      </div>

      <!-- 3. 背景音乐 -->
      <div class="section-card">
        <div class="section-title">
          <span>🎵 背景音乐</span>
          <span style="display:flex;align-items:center;gap:4px;">
            <span id="music-source-tag" style="font-size:10px;color:var(--text-sub);font-weight:400;">内置八音盒</span>
            <span class="section-chevron">▾</span>
          </span>
        </div>
        <div class="section-body">
          <div style="display:flex;gap:6px;">
            <button class="elegant-btn" id="play-btn" type="button" style="flex:2;">▶ 播放</button>
            <button class="elegant-btn" id="replay-btn" type="button" style="flex:1;" title="重头播放">↺</button>

          <input type="range" id="slider-volume" min="0" max="100" value="55">

    <div class="resource-dock glass-panel">
      <label class="elegant-btn">
        + 上传照片
        <input type="file" id="file-input" multiple accept="image/*">
      </label>
      <button class="elegant-btn highlight-btn" id="dock-album-btn" type="button">🎞️ 打开相册集</button>
      <button class="elegant-btn" id="mobile-clear-photos-btn" type="button">清空已上传照片</button>
      <label class="elegant-btn">
        ♪ 上传音乐

  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    /* ==================== 全局配置与状态 ==================== */
    const DB_NAME = 'StarlightTreeV2_DB';
    const IS_MOBILE = window.innerWidth <= 768 || matchMedia('(pointer: coarse)').matches;
    function scenePixelRatio() {
      const budget = IS_MOBILE ? 1_150_000 : 3_200_000;
      return Math.min(window.devicePixelRatio || 1, IS_MOBILE ? 1.3 : 1.6,
        Math.sqrt(budget / Math.max(1, window.innerWidth * window.innerHeight)));
    }

    const CONFIG = {
      tree: {
        count: IS_MOBILE ? 11500 : 25000,
        height: 20.5,
        radius: 10.8
      },
      snow: { count: IS_MOBILE ? 800 : 1400, range: 78, speed: 2.4 },
      camera: { z: IS_MOBILE ? Math.min(85, Math.max(62, 32 * innerHeight / innerWidth)) : 47, minZ: 25, maxZ: 86, y: 1.4 },
      interaction: { rotationSpeed: 1.2 }
    };

    const STATE = {
      mode: 'TREE',       // 'TREE' | 'SCATTER' | 'FOCUS'
      morph: 0,           // 0 = 树形, 1 = 散开星云（GPU uniform 驱动）
      autoRotate: true,
      fireworksEnabled: true,
      introPlaying: true,
      introTime: 0,
      focusTarget: null,
      hand: { detected: false, x: 0 },
      rotY: 0,            // 仅水平旋转，俯仰角 X 彻底锁死为 0
      velY: 0,
      targetZoom: CONFIG.camera.z,
      uiVisible: !IS_MOBILE,
      cameraVisible: true
    };
    let manualDirY = 0;

    /* ==================== IndexedDB 持久化 ==================== */
    let db = null;
    function initDB() {
      return new Promise(resolve => {
        try {
          const req = indexedDB.open(DB_NAME, 1);
          req.onupgradeneeded = e => {
            const d = e.target.result;
            if (!d.objectStoreNames.contains('photos')) d.createObjectStore('photos', { keyPath: 'id' });
            if (!d.objectStoreNames.contains('music')) d.createObjectStore('music', { keyPath: 'id' });
          };
          req.onsuccess = e => { db = e.target.result; resolve(db); };
          req.onerror = () => resolve(null);
        } catch { resolve(null); }
      });
    }
    function savePhotoToDB(dataUrl) {
      const id = `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
      if (db) db.transaction('photos', 'readwrite').objectStore('photos').add({ id, data: dataUrl });
      return id;
    }
    function loadPhotosFromDB() {
      if (!db) return Promise.resolve([]);
      return new Promise(resolve => {
        const req = db.transaction('photos', 'readonly').objectStore('photos').getAll();
        req.onsuccess = e => resolve(e.target.result || []);
        req.onerror = () => resolve([]);
      });
    }
    function deletePhotoFromDB(id) {
      if (db) db.transaction('photos', 'readwrite').objectStore('photos').delete(id);
    }
    function clearPhotosDB() {
      if (db) db.transaction('photos', 'readwrite').objectStore('photos').clear();
    }
    function saveMusicToDB(blob) {
      if (db) db.transaction('music', 'readwrite').objectStore('music').put({ id: 'bgm', data: blob });
    }
    function loadMusicFromDB() {
      if (!db) return Promise.resolve(null);
      return new Promise(resolve => {
        const req = db.transaction('music', 'readonly').objectStore('music').get('bgm');
        req.onsuccess = e => resolve(e.target.result ? e.target.result.data : null);
        req.onerror = () => resolve(null);
      });
    }

    /* ==================== 音乐自动播放 + Analyser 节拍分析 ==================== */
    const bgmAudio = new Audio();
    bgmAudio.loop = true;
    bgmAudio.volume = 0.55;
    let hasCustomMusic = false;
    let isMusicPlaying = false;
    let musicAttempt = 0;

    let audioCtx = null, masterGain = null, analyser = null, freqBins = null, mediaSource = null;
    let chimeTimer = null, chimeStep = 0;

    const MELODY = [
      392, 523.25, 523.25, 587.33, 523.25, 493.88, 440, 440,
      440, 587.33, 587.33, 659.25, 587.33, 523.25, 493.88, 392,
      392, 659.25, 659.25, 698.46, 659.25, 587.33, 523.25, 440,
      392, 392, 440, 587.33, 493.88, 523.25, 0, 0
    ];
    const BASS = [
      130.81, 0, 196, 0, 174.61, 0, 146.83, 0,
      146.83, 0, 220, 0, 196, 0, 130.81, 0,
      130.81, 0, 196, 0, 174.61, 0, 146.83, 0,
      196, 0, 146.83, 0, 196, 130.81, 0, 0
    ];

    function ensureAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = (parseFloat(document.getElementById('slider-volume').value) / 100) * 0.45;
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 128;
        freqBins = new Uint8Array(analyser.frequencyBinCount);
        masterGain.connect(analyser);
        analyser.connect(audioCtx.destination);
      }
    }

    async function connectCustomAudioToAnalyser() {
      try {
        ensureAudioContext();
        if (audioCtx.state !== 'running') await audioCtx.resume();
        if (!mediaSource && audioCtx.state === 'running') {
          mediaSource = audioCtx.createMediaElementSource(bgmAudio);
          mediaSource.connect(analyser);
        }
      } catch {}
    }

    function playChimeNote(freq, bassFreq) {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      if (freq) {
        const osc = audioCtx.createOscillator();
        const over = audioCtx.createOscillator();
        const env = audioCtx.createGain();
        osc.type = 'sine';
        over.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);
        over.frequency.setValueAtTime(freq * 2, now);
        env.gain.setValueAtTime(0.0001, now);
        env.gain.exponentialRampToValueAtTime(0.20, now + 0.015);
        env.gain.exponentialRampToValueAtTime(0.0001, now + 1.8);
        osc.connect(env); over.connect(env); env.connect(masterGain);
        osc.start(now); over.start(now);
        osc.stop(now + 1.85); over.stop(now + 1.85);
      }
      if (bassFreq) {
        const b = audioCtx.createOscillator();
        const be = audioCtx.createGain();
        b.type = 'triangle';
        b.frequency.setValueAtTime(bassFreq, now);
        be.gain.setValueAtTime(0.0001, now);
        be.gain.exponentialRampToValueAtTime(0.09, now + 0.03);
        be.gain.exponentialRampToValueAtTime(0.0001, now + 2.0);
        b.connect(be); be.connect(masterGain);
        b.start(now); b.stop(now + 2.1);
      }
    }

    function startMusicBox() {
      stopMusicBox();
      const idx = chimeStep % MELODY.length;
      playChimeNote(MELODY[idx], BASS[idx]);
      chimeStep++;
      chimeTimer = setInterval(() => {
        const i = chimeStep % MELODY.length;
        playChimeNote(MELODY[i], BASS[i]);
        chimeStep = (chimeStep + 1) % MELODY.length;
      }, 420);
    }
    function stopMusicBox() {
      if (chimeTimer) { clearInterval(chimeTimer); chimeTimer = null; }
    }
    function updatePlayBtnUI(playing) {
      document.getElementById('play-btn').textContent = playing ? '⏸ 暂停' : '▶ 播放';
      document.getElementById('music-quick-btn').textContent = playing ? 'Ⅱ 暂停音乐' : '♫ 播放音乐';
    }
    async function startBackgroundMusic() {
      const attempt = ++musicAttempt;
      try {
        if (hasCustomMusic) {
          const playing = bgmAudio.play();
          connectCustomAudioToAnalyser();
          await playing;
        } else {
          ensureAudioContext();
          if (audioCtx.state !== 'running') await audioCtx.resume();
          if (attempt !== musicAttempt || audioCtx.state !== 'running') return;
          startMusicBox();
        }
        if (attempt !== musicAttempt) return;
        isMusicPlaying = true;
        updatePlayBtnUI(true);
        window.removeEventListener('click', startMusicOnClick);
      } catch {
        if (attempt !== musicAttempt) return;
        isMusicPlaying = false;
        updatePlayBtnUI(false);
      }
    }
    function toggleMusicPlay() {
      window.removeEventListener('click', startMusicOnClick);
      if (!isMusicPlaying) {
        startBackgroundMusic();
        return;
      }
      ++musicAttempt;
      if (hasCustomMusic) bgmAudio.pause();
      else stopMusicBox();
      isMusicPlaying = false;
      updatePlayBtnUI(false);
    }
    function replayMusic() {
      window.removeEventListener('click', startMusicOnClick);
      if (hasCustomMusic) bgmAudio.currentTime = 0;
      else chimeStep = 0;
      startBackgroundMusic();
    }
    function startMusicOnClick(event) {
      if (event.isTrusted && !isMusicPlaying) startBackgroundMusic();
    }
    async function prepareBackgroundMusic(dbReady) {
      window.addEventListener('click', startMusicOnClick);
      await dbReady;
      const savedMusic = await loadMusicFromDB();
      if (musicAttempt) return;
      if (savedMusic) {
        bgmAudio.src = URL.createObjectURL(savedMusic);
        hasCustomMusic = true;
        document.getElementById('music-source-tag').textContent = '已保存音乐';
      }
      startBackgroundMusic();
    }

    /* ==================== Three.js 场景核心 ==================== */
    let scene, camera, renderer, composer, bloomPass, mainGroup, photoMeshGroup, basePropsGroup;
    let drawSilverTree, starField, groundRingsPoints, ambientFireflies;
    const scatterLayers = [];
    let snowPoints = null, snowData = [];
    let softBokehTex, softMistTex, starCrossTex, microStarTex;
    let fireflyData = [];
    const SHOOTING_STARS = [];
    let meteorCooldown = 2.5;
    let animatedDolls = [];
    let photoRecords = []; // { id, data, group, posTree, posScatter, baseScale }

    const clock = new THREE.Clock();
    const inverseGroupMatrix = new THREE.Matrix4();
    const raycaster = new THREE.Raycaster();
    const pointerNDC = new THREE.Vector2();

    function createSoftTextures() {
      // 64x64 高斯衰减圆点贴图
      const bc = document.createElement('canvas');
      bc.width = 64; bc.height = 64;
      const bx = bc.getContext('2d');
      const bg = bx.createRadialGradient(32, 32, 0, 32, 32, 32);
      bg.addColorStop(0.0, 'rgba(255,255,255,1)');
      bg.addColorStop(0.28, 'rgba(245,250,255,0.82)');
      bg.addColorStop(0.60, 'rgba(200,222,250,0.22)');
      bg.addColorStop(1.0, 'rgba(180,210,250,0)');
      bx.fillStyle = bg;
      bx.fillRect(0, 0, 64, 64);
      softBokehTex = new THREE.CanvasTexture(bc);

      // 极柔雾斑贴图（用于底层银色薄纱体积云，消除硬点颗粒感）
      const fc = document.createElement('canvas');
      fc.width = 64; fc.height = 64;
      const fx = fc.getContext('2d');
      const fg = fx.createRadialGradient(32, 32, 0, 32, 32, 32);
      fg.addColorStop(0.0, 'rgba(255,255,255,0.75)');
      fg.addColorStop(0.42, 'rgba(220,235,255,0.38)');
      fg.addColorStop(0.78, 'rgba(180,208,242,0.10)');
      fg.addColorStop(1.0, 'rgba(150,185,230,0)');
      fx.fillStyle = fg;
      fx.fillRect(0, 0, 64, 64);
      softMistTex = new THREE.CanvasTexture(fc);

      // 极纤细十字星芒贴图（绝无大灰白圆球）
      const sc = document.createElement('canvas');
      sc.width = 128; sc.height = 128;
      const sx = sc.getContext('2d');
      sx.translate(64, 64);
      const drawRay = (len, w, a) => {
        const g = sx.createLinearGradient(-len, 0, len, 0);
        g.addColorStop(0, 'rgba(255,255,255,0)');
        g.addColorStop(0.47, `rgba(230,242,255,${a * 0.45})`);
        g.addColorStop(0.5, `rgba(255,255,255,${a})`);
        g.addColorStop(0.53, `rgba(230,242,255,${a * 0.45})`);
        g.addColorStop(1, 'rgba(255,255,255,0)');
        sx.fillStyle = g;
        sx.beginPath();
        sx.ellipse(0, 0, len, w, 0, 0, Math.PI * 2);
        sx.fill();
      };
      drawRay(60, 1.2, 0.95);
      sx.rotate(Math.PI / 2);
      drawRay(60, 1.2, 0.95);
      starCrossTex = new THREE.CanvasTexture(sc);

      // 树身碎钻高光专用：64x64 锐利四角微星芒贴图（模拟施华洛世奇碎钻闪耀）
      const mc = document.createElement('canvas');
      mc.width = 64; mc.height = 64;
      const mx = mc.getContext('2d');
      mx.translate(32, 32);
      const mg = mx.createRadialGradient(0, 0, 0, 0, 0, 14);
      mg.addColorStop(0.0, 'rgba(255,255,255,1)');
      mg.addColorStop(0.35, 'rgba(225,242,255,0.75)');
      mg.addColorStop(1.0, 'rgba(180,215,255,0)');
      mx.fillStyle = mg;
      mx.beginPath(); mx.arc(0, 0, 14, 0, Math.PI * 2); mx.fill();
      for (let k = 0; k < 2; k++) {
        const rg = mx.createLinearGradient(-30, 0, 30, 0);
        rg.addColorStop(0, 'rgba(255,255,255,0)');
        rg.addColorStop(0.45, 'rgba(235,245,255,0.55)');
        rg.addColorStop(0.5, 'rgba(255,255,255,1)');
        rg.addColorStop(0.55, 'rgba(235,245,255,0.55)');
        rg.addColorStop(1, 'rgba(255,255,255,0)');
        mx.fillStyle = rg;
        mx.beginPath(); mx.ellipse(0, 0, 30, 1.4, 0, 0, Math.PI * 2); mx.fill();
        mx.rotate(Math.PI / 2);
      }
      microStarTex = new THREE.CanvasTexture(mc);
    }

    function initThree() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x030106);
      scene.fog = new THREE.FogExp2(0x05020a, 0.0052);

      camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 600);
      camera.position.set(0, CONFIG.camera.y, CONFIG.camera.z);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
      renderer.setPixelRatio(scenePixelRatio());
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.90;
      container.appendChild(renderer.domElement);

      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
      pmrem.dispose();

      mainGroup = new THREE.Group();
      scene.add(mainGroup);

      photoMeshGroup = new THREE.Group();
      mainGroup.add(photoMeshGroup);

      createSoftTextures();
      setupLights();
      createDitheredSkyAndMountains();
      createStarField();
      createAmbientFireflies();
      createDiamondStarlightTree();
      drawSilverTree = createSilverCanvasTree();
      createConcentricGroundRings();
      createTreeBaseDollsAndGifts();
      createSnow();
      setupPostProcessing();
    }

    function setupLights() {
      scene.add(new THREE.AmbientLight(0xd8e2f5, 0.42));

      const keyLight = new THREE.DirectionalLight(0xeef4ff, 0.85);
      keyLight.position.set(22, 32, 34);
      scene.add(keyLight);

      const rimCool = new THREE.DirectionalLight(0x88b4ff, 0.55);
      rimCool.position.set(-28, 18, -24);
      scene.add(rimCool);

      const warmBase = new THREE.PointLight(0xffdcb8, 1.4, 28);
      warmBase.position.set(0, -10.5, 10);
      mainGroup.add(warmBase);
    }

    function setupPostProcessing() {
      const renderPass = new RenderPass(scene, camera);
      // 精准泛光：让冰蓝银丝带、边缘银雾与纯白碎钻绽放原图同款清冷钻光，同时绝不烧白玩偶
      bloomPass = new UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        0.48, 0.48, 0.76
      );
      composer = new EffectComposer(renderer);
      composer.addPass(renderPass);
      composer.addPass(bloomPass);
    }

    /* ==================== 三层景深背景：无色带 GLSL 暗紫夜空 + 黑色远山剪影 ==================== */
    function createDitheredSkyAndMountains() {
      // 1. GLSL 屏幕抖动（dither）夜空穹顶：彻底消除 8-bit 横向色带
      const skyMat = new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        fog: false,
        vertexShader: `
          varying vec3 vWorldPos;
          void main() {
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vWorldPos = wp.xyz;
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: `
          varying vec3 vWorldPos;
          float rand(vec2 co) {
            return fract(sin(dot(co.xy, vec2(12.9898, 78.233))) * 43758.5453);
          }
          void main() {
            vec3 dir = normalize(vWorldPos);
            float h = clamp(dir.y, -0.35, 1.0);
            vec3 zenith = vec3(0.008, 0.004, 0.016);     // 更深邃黑曜夜空
            vec3 midSky = vec3(0.020, 0.009, 0.034);
            vec3 horizonGlow = vec3(0.112, 0.036, 0.108); // 压低 30% 低空紫雾，大幅拉高银钻树对比度
            vec3 groundDark = vec3(0.009, 0.005, 0.015);

            float glowBand = exp(-pow((h - 0.02) / 0.16, 2.0));
            vec3 baseSky = mix(midSky, zenith, smoothstep(0.05, 0.78, h));
            vec3 col = mix(baseSky, horizonGlow, glowBand * 0.92);
            col = mix(groundDark, col, smoothstep(-0.20, 0.04, h));
            // 微量 dither 抖动彻底消灭 8-bit 渐变条纹
            col += (rand(gl_FragCoord.xy) - 0.5) / 255.0;
            gl_FragColor = vec4(col, 1.0);
          }
        `
      });
      scene.add(new THREE.Mesh(new THREE.SphereGeometry(280, 32, 20), skyMat));

      // 2. 中景连绵起伏黑色远山剪影（还原图3中景景深）
      const mShape = new THREE.Shape();
      const width = 320;
      const baseY = -16;
      mShape.moveTo(-width / 2, baseY - 24);
      const segs = 120;
      for (let i = 0; i <= segs; i++) {
        const u = i / segs;
        const x = (u - 0.5) * width;
        const ridge =
          Math.sin(u * Math.PI * 3.2 + 0.4) * 5.2 +
          Math.sin(u * Math.PI * 7.5 + 1.7) * 2.4 +
          Math.cos(u * Math.PI * 13.0) * 0.9;
        mShape.lineTo(x, baseY + 6.5 + ridge);
      }
      mShape.lineTo(width / 2, baseY - 24);
      mShape.closePath();

      const mMesh = new THREE.Mesh(
        new THREE.ShapeGeometry(mShape),
        new THREE.MeshBasicMaterial({ color: 0x040208, depthWrite: false, fog: false })
      );
      mMesh.position.set(0, -1.5, -96);
      scene.add(mMesh);

      // 3. 地面极细星尘雪原（淡紫银微光）
      const gCount = IS_MOBILE ? 700 : 1400;
      const gPos = new Float32Array(gCount * 3);
      for (let i = 0; i < gCount; i++) {
        const r = Math.pow(Math.random(), 0.72) * 86;
        const a = Math.random() * Math.PI * 2;
        gPos[i * 3] = Math.cos(a) * r;
        gPos[i * 3 + 1] = -CONFIG.tree.height / 2 - 0.86 + (Math.random() - 0.5) * 0.14;
        gPos[i * 3 + 2] = Math.sin(a) * r - 8;
      }
      const gGeo = new THREE.BufferGeometry();
      gGeo.setAttribute('position', new THREE.BufferAttribute(gPos, 3));
      const gMat = new THREE.PointsMaterial({
        color: 0xd9c2e8,
        map: softBokehTex,
        size: 0.24,
        transparent: true,
        opacity: 0.30,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });
      scene.add(new THREE.Points(gGeo, gMat));
    }

    function createStarField() {
      const count = IS_MOBILE ? 600 : 1200;
      const pos = new Float32Array(count * 3);
      for (let i = 0; i < count; i++) {
        const r = 110 + Math.random() * 140;
        const th = Math.random() * Math.PI * 2;
        const ph = Math.acos(Math.random() * 0.92); // 集中在上半夜空
        pos[i * 3] = r * Math.sin(ph) * Math.cos(th);
        pos[i * 3 + 1] = r * Math.cos(ph) - 6;
        pos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      starField = new THREE.Points(geo, new THREE.PointsMaterial({
        color: 0xeaf0ff,
        map: softBokehTex,
        size: 0.52,
        transparent: true,
        opacity: 0.62,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      }));
      scene.add(starField);
    }

    /* ==================== 背景漂浮星尘流萤 + 夜空流星 ==================== */
    function createAmbientFireflies() {
      const count = IS_MOBILE ? 450 : 950;
      const pos = new Float32Array(count * 3);
      const col = new Float32Array(count * 3);
      const pal = [new THREE.Color(0xffe8b8), new THREE.Color(0xdceeff), new THREE.Color(0xffcce0)];
      fireflyData = [];
      for (let i = 0; i < count; i++) {
        const x = (Math.random() - 0.5) * 96;
        const y = -12 + Math.random() * 44;
        const z = -60 + Math.random() * 75;
        pos[i * 3] = x; pos[i * 3 + 1] = y; pos[i * 3 + 2] = z;
        const c = pal[i % pal.length];
        col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
        fireflyData.push({ x, y, z, vy: 0.35 + Math.random() * 0.65, phase: Math.random() * 6.28 });
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
      ambientFireflies = new THREE.Points(geo, new THREE.PointsMaterial({
        size: 0.34, map: softBokehTex, vertexColors: true,
        transparent: true, opacity: 0.58, depthWrite: false, blending: THREE.AdditiveBlending
      }));
      scene.add(ambientFireflies);
    }

    function updateFirefliesAndMeteors(dt, et) {
      if (ambientFireflies) {
        const arr = ambientFireflies.geometry.attributes.position.array;
        for (let i = 0; i < fireflyData.length; i++) {
          const f = fireflyData[i];
          f.y += f.vy * dt;
          f.x += Math.sin(et * 0.7 + f.phase) * 0.45 * dt;
          if (f.y > 32) { f.y = -12; f.x = (Math.random() - 0.5) * 96; }
          arr[i * 3] = f.x; arr[i * 3 + 1] = f.y; arr[i * 3 + 2] = f.z;
        }
        ambientFireflies.geometry.attributes.position.needsUpdate = true;
      }
      if (!STATE.introPlaying) {
        meteorCooldown -= dt;
        if (meteorCooldown <= 0 && SHOOTING_STARS.length < 2) {
          meteorCooldown = 3.2 + Math.random() * 4.5;
          const sx = (Math.random() - 0.3) * 75;
          const sy = 16 + Math.random() * 14;
          const sz = -45 - Math.random() * 35;
          const vx = -(22 + Math.random() * 16), vy = -(9 + Math.random() * 7);
          const geo = new THREE.BufferGeometry();
          geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([sx, sy, sz, sx, sy, sz]), 3));
          const mat = new THREE.LineBasicMaterial({ color: 0xeaf4ff, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending });
          const line = new THREE.Line(geo, mat);
          scene.add(line);
          SHOOTING_STARS.push({ line, geo, mat, x: sx, y: sy, z: sz, vx, vy, age: 0, life: 0.95 });
        }
      }
      for (let i = SHOOTING_STARS.length - 1; i >= 0; i--) {
        const m = SHOOTING_STARS[i];
        m.age += dt;
        if (m.age >= m.life) {
          scene.remove(m.line); m.geo.dispose(); m.mat.dispose(); SHOOTING_STARS.splice(i, 1); continue;
        }
        m.x += m.vx * dt; m.y += m.vy * dt;
        const arr = m.geo.attributes.position.array;
        arr[0] = m.x; arr[1] = m.y; arr[2] = m.z;
        arr[3] = m.x - m.vx * 0.16; arr[4] = m.y - m.vy * 0.16; arr[5] = m.z;
        m.geo.attributes.position.needsUpdate = true;
        m.mat.opacity = Math.max(0, 1 - m.age / m.life);
      }
    }

    /* ==================== 猛烈壮观的金色垂柳 + 多彩瀑布烟花 ==================== */
    const WILLOW_FIREWORKS = [];
    const FW_SCHEMES = [
      { head: 0xfff8d6, mid: 0xf0b24a, tail: 0x7a400e }, // 炽热香槟金垂柳
      { head: 0xfff6dc, mid: 0xffc66e, tail: 0x8a4d12 }, // 暖金光雨
      { head: 0xffeef6, mid: 0xf08eb8, tail: 0x692248 }, // 玫瑰粉金烟花
      { head: 0xf0f8ff, mid: 0x8cc8ff, tail: 0x244a82 }  // 冰蓝银钻烟花
    ];
    let fwCooldown = 0.35;

    function spawnWillowFirework() {
      const strands = IS_MOBILE ? 75 : 130;
      const trailLen = 22; // 22 节超长垂柳瀑布尾迹，视觉更震撼
      const side = Math.random() < 0.5 ? -1 : 1;
      const ox = side * (12 + Math.random() * 28);
      const oy = 8 + Math.random() * 15;
      const oz = -30 - Math.random() * 26;

      const scheme = FW_SCHEMES[Math.random() < 0.65 ? Math.floor(Math.random() * 2) : (2 + Math.floor(Math.random() * 2))];
      const segCount = strands * (trailLen - 1);
      const positions = new Float32Array(segCount * 2 * 3);
      const colors = new Float32Array(segCount * 2 * 3);

      const headColor = new THREE.Color(scheme.head);
      const midColor = new THREE.Color(scheme.mid);
      const tailColor = new THREE.Color(scheme.tail);

      const strandData = [];
      const burstSpeed = 9.5 + Math.random() * 6.5; // 爆炸范围更猛烈开阔

      for (let s = 0; s < strands; s++) {
        const th = Math.random() * Math.PI * 2;
        const ph = Math.acos(2 * Math.random() - 1);
        const sp = burstSpeed * (0.48 + Math.random() * 0.62);
        const hist = [];
        for (let k = 0; k < trailLen; k++) hist.push(ox, oy, oz);
        strandData.push({
          x: ox, y: oy, z: oz,
          vx: Math.sin(ph) * Math.cos(th) * sp,
          vy: Math.sin(ph) * Math.sin(th) * sp * 0.88 + 2.2,
          vz: Math.cos(ph) * sp,
          hist
        });
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      const mat = new THREE.LineBasicMaterial({
        vertexColors: true,
        transparent: true,
        opacity: 1.0,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const lines = new THREE.LineSegments(geo, mat);
      scene.add(lines);

      WILLOW_FIREWORKS.push({
        lines, geo, mat, strandData, trailLen, headColor, midColor, tailColor,
        age: 0, life: 3.3 + Math.random() * 1.1
      });
    }

    function updateWillowFireworks(dt) {
      if (STATE.fireworksEnabled && !STATE.introPlaying) {
        fwCooldown -= dt;
        if (fwCooldown <= 0 && WILLOW_FIREWORKS.length < 8) {
          spawnWillowFirework();
          if (Math.random() < 0.35 && WILLOW_FIREWORKS.length < 7) spawnWillowFirework();
          fwCooldown = 0.55 + Math.random() * 0.75;
        }
      }
      for (let i = WILLOW_FIREWORKS.length - 1; i >= 0; i--) {
        const fw = WILLOW_FIREWORKS[i];
        fw.age += dt;
        if (fw.age >= fw.life) {
          scene.remove(fw.lines); fw.geo.dispose(); fw.mat.dispose();
          WILLOW_FIREWORKS.splice(i, 1);
          continue;
        }
        const pos = fw.geo.attributes.position.array;
        const col = fw.geo.attributes.color.array;
        const drag = Math.pow(0.952, dt * 60);
        const lifeT = fw.age / fw.life;
        const globalFade = Math.max(0, 1 - Math.pow(lifeT, 1.4));
        const tl = fw.trailLen;

        let ptr = 0;
        for (let s = 0; s < fw.strandData.length; s++) {
          const st = fw.strandData[s];
          st.vx *= drag;
          st.vy = st.vy * drag - 5.0 * dt;
          st.vz *= drag;
          st.x += st.vx * dt;
          st.y += st.vy * dt;
          st.z += st.vz * dt;

          for (let k = tl - 1; k > 0; k--) {
            st.hist[k * 3] = st.hist[(k - 1) * 3];
            st.hist[k * 3 + 1] = st.hist[(k - 1) * 3 + 1];
            st.hist[k * 3 + 2] = st.hist[(k - 1) * 3 + 2];
          }
          st.hist[0] = st.x; st.hist[1] = st.y; st.hist[2] = st.z;

          for (let k = 0; k < tl - 1; k++) {
            const f0 = 1 - k / (tl - 1);
            const f1 = 1 - (k + 1) / (tl - 1);
            pos[ptr]     = st.hist[k * 3];
            pos[ptr + 1] = st.hist[k * 3 + 1];
            pos[ptr + 2] = st.hist[k * 3 + 2];
            pos[ptr + 3] = st.hist[(k + 1) * 3];
            pos[ptr + 4] = st.hist[(k + 1) * 3 + 1];
            pos[ptr + 5] = st.hist[(k + 1) * 3 + 2];

            const c0 = f0 > 0.65 ? fw.headColor : fw.midColor;
            const c1 = f1 > 0.38 ? fw.midColor : fw.tailColor;
            const a0 = f0 * globalFade * 1.15;
            const a1 = f1 * globalFade * 0.85;

            col[ptr]     = c0.r * a0; col[ptr + 1] = c0.g * a0; col[ptr + 2] = c0.b * a0;
            col[ptr + 3] = c1.r * a1; col[ptr + 4] = c1.g * a1; col[ptr + 5] = c1.b * a1;
            ptr += 6;
          }
        }
        fw.geo.attributes.position.needsUpdate = true;
        fw.geo.attributes.color.needsUpdate = true;
      }
    }

    /* ==================== GPU 双层星钻银白圣诞树（零过曝 + 零 CPU 插值） ==================== */
    function computeScatterPos(minR, spreadR) {
      // 偏扁星系盘分布，散开后更有星空漩涡美感
      const r = minR + Math.random() * spreadR;
      const th = Math.random() * Math.PI * 2;
      const ph = Math.acos(2 * Math.random() - 1);
      return new THREE.Vector3(
        r * Math.sin(ph) * Math.cos(th) * 1.15,
        r * Math.cos(ph) * 0.58,
        r * Math.sin(ph) * Math.sin(th) * 1.15
      );
    }

    /* ==================== 1:1 复刻原图星钻冰银圣诞树（微凹钟形冷杉 + 6圈螺旋银雾波脊 + 冰白星灯 + 5圈星轨底环） ==================== */
    // 原图精确微凹钟形轮廓：树冠纤秀优雅、底部宽广舒展，外缘随 6.2 圈螺旋自然微张成层层向下裙摆
    function firEnvelopeRadius(u) {
      const baseR = CONFIG.tree.radius * 1.12;
      const turns = 6.2;
      const tierPhase = (u * turns) % 1.0;
      const edgeFlare = 1.0 + 0.16 * Math.pow(1.0 - tierPhase, 1.45);
      // 关键：pow(1 - u, 1.18) 还原原图优美的微凹钟形曲线（不再是死板直三角！）
      const cone = Math.pow(Math.max(0.0, 1.0 - u * 0.935), 1.18);
      const crownCap = u > 0.91 ? (0.60 + 0.40 * Math.cos(((u - 0.91) / 0.09) * Math.PI * 0.5)) : 1.0;
      return Math.max(0.48, baseR * cone * edgeFlare * crownCap);
    }

    function createDiamondStarlightTree() {
      const h = CONFIG.tree.height;
      const dpr = scenePixelRatio();

      // 122,000 颗原图 1:1 采样冰银微粒：
      // 28000 螺旋波脊柔银雾 + 62000 极细冷杉冰银砂粒 + 32000 丝带下缘/左右肩部冰白雪羽 + 340 颗锐利纯白钻石星灯
      const canopyCount  = IS_MOBILE ? 9500  : 28000;
      const mistCount    = IS_MOBILE ? 22000 : 62000;
      const frostCount   = IS_MOBILE ? 11000 : 32000;
      const lanternCount = IS_MOBILE ? 220   : 340;

      // 原图逐亮度区间实测 RGB：#181b24 -> #353e4c -> #5b6675 -> #8996a5 -> #bcc9d7 -> #e4f0fb
      const canopyPal = [
        new THREE.Color(0x353e4c),
        new THREE.Color(0x5b6675),
        new THREE.Color(0x8996a5),
        new THREE.Color(0xc2d2e4)
      ];
      const bodyPal = [
        new THREE.Color(0x2d3645),
        new THREE.Color(0x566478),
        new THREE.Color(0x96a8be),
        new THREE.Color(0xe4f0fb)
      ];
      const frostPal = [
        new THREE.Color(0x8ea2ba),
        new THREE.Color(0xc4d4e6),
        new THREE.Color(0xeaf4ff)
      ];

      function buildTreeLayer(count, mode, order) {
        const posTree = new Float32Array(count * 3);
        const posScatter = new Float32Array(count * 3);
        const colors = new Float32Array(count * 3);
        const sizes = new Float32Array(count);
        const phases = new Float32Array(count);
        const speeds = new Float32Array(count);
        const lits = new Float32Array(count);

        const turns = 6.2;
        for (let i = 0; i < count; i++) {
          let x, y, z, lit;
          if ((mode === 'canopy' && Math.random() < 0.56) || (mode === 'frost' && Math.random() < 0.62)) {
            // 原图核心灵魂：沿着 6.2 圈丝带正下方涌动的宽幅冰银星尘裙摆（丝带处最亮、两圈之间自然沉暗！）
            const u = (1.0 - Math.pow(Math.random(), 0.62)) * 0.94;
            const ribR = firEnvelopeRadius(u);
            const a = u * turns * Math.PI * 2 + (Math.random() - 0.5) * 0.85;
            const spread = Math.pow(Math.random(), 0.65);
            const r = ribR * (0.72 + 0.34 * spread);
            // 丝带正下方向下垂拂 0 ~ 1.65 单位，越紧贴丝带越亮
            const drop = Math.pow(Math.random(), 1.35) * (1.65 * (1.0 - u * 0.42));
            x = Math.cos(a) * r;
            y = u * h * 0.92 - h / 2 + 0.25 - drop;
            z = Math.sin(a) * r;
            lit = Math.min(1.0, (0.55 + 0.45 * (1.0 - drop / 1.7)) * (0.82 + 0.28 * (1.0 - u)));
          } else if (mode === 'lantern' && Math.random() < 0.32) {
            // 原图代码 def lantern(u, t): x, y, z = ribbon(u, t / 4) — 32% 钻石星灯直接缀在丝带附近！
            const u = (1.0 - Math.pow(Math.random(), 0.60)) * 0.93;
            const ribR = firEnvelopeRadius(u);
            const a = u * turns * Math.PI * 2 + (Math.random() - 0.5) * 0.35;
            const r = ribR * (0.86 + 0.16 * Math.random());
            x = Math.cos(a) * r;
            y = u * h * 0.92 - h / 2 + 0.20 - Math.random() * 0.75;
            z = Math.sin(a) * r;
            lit = 1.0;
          } else {
            // 树体主体积（均衡微凹钟形采样，底部宽广饱满、顶部精致收束不堆白也不发黑）
            const u = (1.0 - Math.pow(Math.random(), 0.58)) * (mode === 'lantern' ? 0.94 : 0.96);
            const envR = firEnvelopeRadius(u);
            const a = Math.random() * Math.PI * 2;
            const twigNoise = 0.94 + 0.12 * (0.5 + 0.5 * Math.sin(a * 11.0 + u * 28.0));
            const maxR = envR * twigNoise;

            let radial;
            if (mode === 'canopy') {
              radial = 0.28 + 0.72 * Math.pow(Math.random(), 0.50);
            } else if (mode === 'mist') {
              radial = 0.34 + 0.68 * Math.pow(Math.random(), 0.40);
            } else if (mode === 'frost') {
              radial = 0.76 + 0.29 * Math.pow(Math.random(), 0.46);
            } else {
              radial = 0.78 + 0.24 * Math.random();
            }

            const tierPhase = (u * turns) % 1.0;
            const edgeDroop = -Math.pow(radial, 2.1) * (0.60 * (1.0 - u * 0.48)) * (1.0 - tierPhase * 0.5);
            const r = maxR * radial;

            x = Math.cos(a) * r;
            y = u * h - h / 2 + edgeDroop + (Math.random() - 0.5) * 0.16;
            z = Math.sin(a) * r;

            // 计算该点距离最近螺旋丝带波脊的远近：波脊亮、谷底深，立体冷杉层次一眼惊艳！
            const spiralPhase = Math.abs(((a / (Math.PI * 2)) - u * turns) % 1.0);
            const waveDist = Math.min(spiralPhase, 1.0 - spiralPhase);
            const ridgeBoost = Math.pow(Math.max(0.0, 1.0 - waveDist * 2.4), 1.6) * 0.42;
            const bottomGlow = Math.pow(1.0 - u, 1.45) * 0.24;
            lit = Math.min(1.0, Math.max(0.14, radial * 0.48 + ridgeBoost + bottomGlow));
          }

          posTree[i * 3] = x;
          posTree[i * 3 + 1] = y;
          posTree[i * 3 + 2] = z;
          lits[i] = lit;

          const sc = computeScatterPos(8.5, 19);
          posScatter[i * 3] = sc.x;
          posScatter[i * 3 + 1] = sc.y;
          posScatter[i * 3 + 2] = sc.z;

          if (mode === 'canopy') {
            const idx = Math.min(3, Math.floor(Math.pow(lit, 0.95) * 3.9));
            const c = canopyPal[idx];
            colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
            sizes[i] = (4.6 + Math.random() * 4.4) * dpr;
            speeds[i] = 0.25 + Math.random() * 0.38;
          } else if (mode === 'mist') {
            const idx = Math.min(3, Math.floor(Math.pow(lit, 0.95) * 3.9));
            const c = bodyPal[idx];
            colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
            sizes[i] = (0.95 + Math.random() * 1.05) * dpr;
            speeds[i] = 0.45 + Math.random() * 0.65;
          } else if (mode === 'frost') {
            const idx = lit > 0.66 ? 2 : (lit > 0.42 ? 1 : 0);
            const c = frostPal[idx];
            colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
            sizes[i] = (1.10 + Math.random() * 1.45) * dpr;
            speeds[i] = 0.9 + Math.random() * 1.4;
          } else {
            colors[i * 3] = 0.96; colors[i * 3 + 1] = 0.985; colors[i * 3 + 2] = 1.0;
            const tierS = Math.random();
            const px = tierS < 0.30 ? (7.6 + Math.random() * 2.2) : (tierS < 0.72 ? (5.2 + Math.random() * 1.6) : (3.4 + Math.random() * 1.1));
            sizes[i] = px * dpr;
            speeds[i] = 1.5 + Math.random() * 2.2;
          }
          phases[i] = Math.random() * Math.PI * 2;
        }

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(posTree, 3));
        geo.setAttribute('aPosScatter', new THREE.BufferAttribute(posScatter, 3));
        geo.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));
        geo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
        geo.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));
        geo.setAttribute('aSpeed', new THREE.BufferAttribute(speeds, 1));
        geo.setAttribute('aLit', new THREE.BufferAttribute(lits, 1));

        const tex = mode === 'canopy' ? softMistTex : softBokehTex;
        const modeCode = mode === 'canopy' ? 0.0 : (mode === 'mist' ? 1.0 : (mode === 'frost' ? 2.0 : 3.0));

        const mat = new THREE.ShaderMaterial({
          uniforms: {
            uTime: { value: 0 },
            uMorph: { value: 0 },
            uMap: { value: tex },
            uMode: { value: modeCode },
            uOpacity: { value: 0 }
          },
          transparent: true,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
          vertexShader: `
            attribute vec3 aPosScatter;
            attribute vec3 aColor;
            attribute float aSize;
            attribute float aPhase;
            attribute float aSpeed;
            attribute float aLit;
            uniform float uTime;
            uniform float uMorph;
            uniform float uMode;
            varying vec3 vColor;
            varying float vAlpha;
            void main() {
              vec3 pos = mix(position, aPosScatter, uMorph);
              pos.y += sin(uTime * 0.7 + aPhase) * 0.25 * uMorph;
              vec4 mv = modelViewMatrix * vec4(pos, 1.0);
              vec4 centerMv = modelViewMatrix * vec4(0.0, pos.y, 0.0, 1.0);
              float relZ = mv.z - centerMv.z;
              float depthShade = mix(smoothstep(-8.5, 5.2, relZ), 1.0, uMorph);
              float frontLit = 0.24 + 0.76 * depthShade;
              float boughLit = mix(0.32 + 0.68 * aLit, 1.0, uMorph);

              gl_Position = projectionMatrix * mv;

        dust.fillRect(center - radius, y, radius * 2, 2);
      }
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.generateMipmaps = false;
      texture.minFilter = THREE.LinearFilter;
      const material = new THREE.SpriteMaterial({ map: texture, depthWrite: false, toneMapped: false });
      const sprite = new THREE.Sprite(material);
      const unitsPerPixel = CONFIG.tree.height / 760;
      sprite.scale.set(cropWidth * unitsPerPixel, cropHeight * unitsPerPixel, 1);
      sprite.position.y = -CONFIG.tree.height / 2 + (980 - top - cropHeight / 2) * unitsPerPixel;
      scene.add(sprite);
      return (t, spin, opacity) => {
        sprite.visible = opacity > 0.01;
        if (!sprite.visible) return;
        material.opacity = opacity;
        ctx.clearRect(left, top, cropWidth, cropHeight);
        ctx.globalAlpha = 1;
          const ribbon = ribbonTurns(t);
          drawRibbonRear(ribbon);
          ctx.drawImage(dust.canvas, 0, 0);
          ctx.fillStyle = '#cbdeef';
          for (const p of driftingDust) {
            const a = p.angle + spin;
            const z = Math.sin(a);
            const x = center + p.radius * Math.cos(a);
            const y = p.y + p.radius * z * .115;
            const flicker = Math.sin(t * 2.4 + p.phase + a * .4) ** 8;
            const rolling = Math.sin(a * 2 + p.y * .025 - t * 1.8) ** 4;
            ctx.globalAlpha = p.strength * (.31 + .46 * flicker + .23 * rolling);
            ctx.fillRect(x, y, p.size, p.size * .78);
          }
          const cos = Math.cos(spin);
          const sin = Math.sin(spin);
          for (const p of lights) {
            const x = center + p.dx * cos + p.depth * sin;
            const y = p.y + (p.depth * (cos - 1) - p.dx * sin) * .115;
            const flicker = Math.cos(t * p.rate + p.phase * Math.sin(t * .50)) ** 10;
            const swell = Math.cos(t * .95 + p.phase + p.y * .015) ** 4;
            const flash = .68 + .23 * flicker + .09 * swell;
            const intensity = Math.min(1, p.intensity * (1.06 * flash + .059));
            if (p.size > 7) stamp(ctx, halo, x, y, p.size * (4.8 + 2.0 * flicker), intensity * (.40 + .23 * flicker));
            stamp(ctx, whiteSpark, x, y, p.size * (.88 + .18 * flash), intensity);
          }
          drawRibbonFront(ribbon, t);
          drawStar(.10 + spin);
          ctx.globalAlpha = 1;
        texture.needsUpdate = true;
      };
    }

    function createConcentricGroundRings() {
      const baseR = CONFIG.tree.radius;
      const baseY = -CONFIG.tree.height / 2 - 0.72;
      const radii = [baseR * 1.06, baseR * 1.32, baseR * 1.60, baseR * 1.92, baseR * 2.26];
      const pts = [], cols = [];
      const cInner = new THREE.Color(0xdce6f2);
      const cOuter = new THREE.Color(0x6e7b8c);

      radii.forEach((rr, idx) => {
        const n = Math.max(160, 340 - idx * 32);
        const fade = 1 - idx * 0.15;
        const c = cInner.clone().lerp(cOuter, idx / (radii.length - 1));
        for (let k = 0; k < n; k++) {
          const a = (k / n) * Math.PI * 2 + Math.random() * 0.03;
          const rj = rr + (Math.random() - 0.5) * 0.18;
          pts.push(Math.cos(a) * rj, baseY + (Math.random() - 0.5) * 0.03, Math.sin(a) * rj);
          cols.push(c.r * fade * 0.85, c.g * fade * 0.85, c.b * fade * 0.85);
        }
      });
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
      geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
      groundRingsPoints = new THREE.Points(geo, new THREE.PointsMaterial({
        size: 0.22, map: softBokehTex, vertexColors: true,
        transparent: true, opacity: 0.78, depthWrite: false, blending: THREE.AdditiveBlending
      }));
      mainGroup.add(groundRingsPoints);
    }
